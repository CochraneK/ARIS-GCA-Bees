name: ARIS4C014 China Pilot 1A Graph

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "papers/014-public-integrity-forensics/code/live_china_pilot1a_graph.py"
      - "papers/014-public-integrity-forensics/code/china_entity_resolution.py"
      - "papers/014-public-integrity-forensics/code/china_procurement_graph.py"
      - ".github/workflows/aris4c014-china-pilot1a-graph.yml"

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPER_DIR: papers/014-public-integrity-forensics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded multi-notice graph pilot
        working-directory: papers/014-public-integrity-forensics/code
        run: python live_china_pilot1a_graph.py
      - name: Validate no-risk boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("papers/014-public-integrity-forensics/code/china_pilot1a_graph_summary.json")
          r=json.loads(p.read_text())
          assert r["pilot"]=="CHINA_PILOT_1A_PROCUREMENT_GRAPH_JOINABILITY"
          assert r["corruption_inference"] is False
          assert r["risk_score_computed"] is False
          assert r["named_risk_findings_emitted"] is False
          identity=r["cross_manifestation_resolution"]
          assert identity["automatic_name_only_merges"]==0
          assert identity["corruption_inference"] is False
          assert identity["nodes_with_valid_cn_uscc"]>=1
          assert identity["stable_id_conflict_decisions"]>=0
          assert r["graph"]["suppliers_with_stable_uscc"]>=1
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Persist aggregate-only graph summary
        run: |
          cp "$PAPER_DIR/code/china_pilot1a_graph_summary.json" "$PAPER_DIR/data/china_pilot1a_graph_summary.json"
          git config user.name "ARIS4C Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$PAPER_DIR/data/china_pilot1a_graph_summary.json"
          if ! git diff --cached --quiet; then
            git commit -m "014: persist China Pilot 1A graph joinability summary"
            git pull --rebase origin main
            git push
          fi
