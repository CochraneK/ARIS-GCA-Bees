name: ARIS4C004 real-data pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c004-pilot.yml"
      - "papers/004-counterfactual-cost-of-exclusion/code/acquire/openalex_pilot.py"
      - "papers/004-counterfactual-cost-of-exclusion/code/resolve/**"
      - "papers/004-counterfactual-cost-of-exclusion/code/config/pilot_config.json"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/science_candidates_frozen.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPER_DIR: papers/004-counterfactual-cost-of-exclusion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize from frozen pre-exposure candidate frame
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PAPER_DIR/data/interim/openalex/identity_packet"
          SOURCE="$PAPER_DIR/data/derived/science_candidates_frozen.csv"
          TARGET="$PAPER_DIR/data/interim/science_candidates_frozen.csv"
          test -s "$SOURCE"
          ROWS=$(($(wc -l < "$SOURCE") - 1))
          test "$ROWS" -eq 100
          cp "$SOURCE" "$TARGET"
          echo "Using frozen candidate frame: $ROWS candidates"

      - name: Add Wikidata identifier leads
        continue-on-error: true
        run: |
          python "$PAPER_DIR/code/resolve/wikidata_identifiers.py" \
            "$PAPER_DIR/data/interim/science_candidates_frozen.csv" \
            --output "$PAPER_DIR/data/interim/science_candidates_identifiers.csv"

      - name: Ensure identifier table exists after transient WDQS failure
        shell: bash
        run: |
          if [ ! -f "$PAPER_DIR/data/interim/science_candidates_identifiers.csv" ]; then
            cp "$PAPER_DIR/data/interim/science_candidates_frozen.csv" \
              "$PAPER_DIR/data/interim/science_candidates_identifiers.csv"
          fi

      - name: Run bounded keyless OpenAlex feasibility pull
        continue-on-error: true
        run: |
          python "$PAPER_DIR/code/acquire/openalex_pilot.py" \
            "$PAPER_DIR/data/interim/science_candidates_identifiers.csv" \
            --out-dir "$PAPER_DIR/data/interim/openalex" \
            --year-min 1900 \
            --year-max 2000 \
            --max-candidates 30 \
            --max-works-per-author 100 \
            --search-n 10 \
            --sleep-rps 2

      - name: Detect likely OpenAlex author fragmentation
        if: always()
        shell: bash
        run: |
          AUDIT="$PAPER_DIR/data/interim/openalex/openalex_resolution_audit.jsonl"
          if [ -s "$AUDIT" ]; then
            python "$PAPER_DIR/code/resolve/openalex_cluster_review.py" \
              "$AUDIT" \
              --output-csv "$PAPER_DIR/data/interim/openalex/identity_review_queue.csv" \
              --summary-json "$PAPER_DIR/data/interim/openalex/identity_review_summary.json"
          fi

      - name: Collect pairwise evidence for plausible author fragments
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          QUEUE="$PAPER_DIR/data/interim/openalex/identity_review_queue.csv"
          if [ -s "$QUEUE" ]; then
            python "$PAPER_DIR/code/resolve/openalex_cluster_evidence.py" \
              "$QUEUE" \
              --out-dir "$PAPER_DIR/data/interim/openalex/cluster_evidence" \
              --year-min 1800 \
              --year-max 2026 \
              --max-works-per-id 200 \
              --sleep-rps 2
          fi

      - name: Apply conservative identity-evidence guard
        if: always()
        shell: bash
        run: |
          PAIRS="$PAPER_DIR/data/interim/openalex/cluster_evidence/cluster_pairwise_evidence.jsonl"
          if [ -s "$PAIRS" ]; then
            python "$PAPER_DIR/code/resolve/cluster_evidence_guard.py" \
              "$PAIRS" \
              --output-jsonl "$PAPER_DIR/data/interim/openalex/cluster_evidence/cluster_pairwise_evidence_guarded.jsonl" \
              --summary-json "$PAPER_DIR/data/interim/openalex/cluster_evidence/cluster_guard_summary.json"
          fi

      - name: Build accepted-record lifetime profiles
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          AUTHORS="$PAPER_DIR/data/interim/openalex/openalex_authors.jsonl"
          WORKS="$PAPER_DIR/data/interim/openalex/openalex_works.jsonl"
          if [ -s "$AUTHORS" ] && [ -s "$WORKS" ]; then
            python "$PAPER_DIR/code/resolve/build_single_author_profiles.py" \
              --candidates "$PAPER_DIR/data/interim/science_candidates_frozen.csv" \
              --authors "$AUTHORS" \
              --works "$WORKS" \
              --output-jsonl "$PAPER_DIR/data/interim/openalex/identity_packet/accepted_author_profiles.jsonl"
          fi

      - name: Fetch mental-health-blind Wikidata authority evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python "$PAPER_DIR/code/resolve/wikidata_identity_evidence.py" \
            "$PAPER_DIR/data/interim/science_candidates_frozen.csv" \
            --output-jsonl "$PAPER_DIR/data/interim/openalex/identity_packet/wikidata_identity_evidence.jsonl" \
            --summary-json "$PAPER_DIR/data/interim/openalex/identity_packet/wikidata_identity_summary.json" \
            --max-candidates 30

      - name: Assemble unified person-level identity review packet
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          OUT="$PAPER_DIR/data/interim/openalex/identity_packet"
          : > "$OUT/all_author_profiles.jsonl"
          [ -s "$OUT/accepted_author_profiles.jsonl" ] && cat "$OUT/accepted_author_profiles.jsonl" >> "$OUT/all_author_profiles.jsonl"
          [ -s "$PAPER_DIR/data/interim/openalex/cluster_evidence/cluster_author_profiles.jsonl" ] && cat "$PAPER_DIR/data/interim/openalex/cluster_evidence/cluster_author_profiles.jsonl" >> "$OUT/all_author_profiles.jsonl"
          touch "$PAPER_DIR/data/interim/openalex/cluster_evidence/cluster_pairwise_evidence_guarded.jsonl"
          touch "$OUT/wikidata_identity_evidence.jsonl"
          python "$PAPER_DIR/code/resolve/build_identity_review_packet.py" \
            --candidates "$PAPER_DIR/data/interim/science_candidates_frozen.csv" \
            --queue "$PAPER_DIR/data/interim/openalex/identity_review_queue.csv" \
            --profiles "$OUT/all_author_profiles.jsonl" \
            --guarded-pairs "$PAPER_DIR/data/interim/openalex/cluster_evidence/cluster_pairwise_evidence_guarded.jsonl" \
            --authority "$OUT/wikidata_identity_evidence.jsonl" \
            --output-jsonl "$OUT/identity_review_packet.jsonl" \
            --output-md "$OUT/IDENTITY_REVIEW_PACKET.md" \
            --summary-json "$OUT/identity_review_packet_summary.json" \
            --max-candidates 30

      - name: Summarize candidate, network and identity-review coverage
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["PAPER_DIR"]) / "data" / "interim"
          ids_path = root / "science_candidates_identifiers.csv"
          rows = list(csv.DictReader(ids_path.open(encoding="utf-8-sig")))
          summary = {
              "candidate_n": len(rows),
              "candidate_frame_frozen": True,
              "candidate_frame_seed": 20260918,
              "qid_n": sum(bool((r.get("wikidata_qid") or "").strip()) for r in rows),
              "orcid_lead_n": sum(bool((r.get("orcid") or "").strip()) for r in rows),
              "openalex_id_lead_n": sum(bool((r.get("openalex_author_id") or "").strip()) for r in rows),
              "cohort_visibility_strata": Counter(r.get("pilot_stratum", "") for r in rows),
              "regions": Counter(r.get("region", "") for r in rows),
              "level2_occupations": Counter(r.get("level2_main_occ", "") for r in rows),
          }
          oa = root / "openalex" / "openalex_acquisition_summary.json"
          if oa.exists():
              summary["openalex_pull"] = json.loads(oa.read_text())
          identity = root / "openalex" / "identity_review_summary.json"
          if identity.exists():
              summary["identity_review"] = json.loads(identity.read_text())
          cluster = root / "openalex" / "cluster_evidence" / "cluster_evidence_summary.json"
          if cluster.exists():
              summary["cluster_evidence_raw"] = json.loads(cluster.read_text())
          guard = root / "openalex" / "cluster_evidence" / "cluster_guard_summary.json"
          if guard.exists():
              summary["cluster_evidence_guarded"] = json.loads(guard.read_text())
          authority = root / "openalex" / "identity_packet" / "wikidata_identity_summary.json"
          if authority.exists():
              summary["authority_evidence"] = json.loads(authority.read_text())
          packet = root / "openalex" / "identity_packet" / "identity_review_packet_summary.json"
          if packet.exists():
              summary["identity_packet"] = json.loads(packet.read_text())
          out = root / "pilot_summary.json"
          out.write_text(json.dumps(summary, indent=2, default=dict) + "\n", encoding="utf-8")
          print(out.read_text())
          PY

      - name: Upload public-safe pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aris4c004-science-pilot
          path: |
            ${{ env.PAPER_DIR }}/data/interim/science_candidates_frozen.csv
            ${{ env.PAPER_DIR }}/data/interim/science_candidates_identifiers.csv
            ${{ env.PAPER_DIR }}/data/interim/pilot_summary.json
            ${{ env.PAPER_DIR }}/data/interim/openalex/openalex_acquisition_summary.json
            ${{ env.PAPER_DIR }}/data/interim/openalex/openalex_resolution_audit.jsonl
            ${{ env.PAPER_DIR }}/data/interim/openalex/openalex_unresolved.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/identity_review_queue.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/identity_review_summary.json
            ${{ env.PAPER_DIR }}/data/interim/openalex/cluster_evidence/cluster_evidence_summary.json
            ${{ env.PAPER_DIR }}/data/interim/openalex/cluster_evidence/cluster_pairwise_evidence.jsonl
            ${{ env.PAPER_DIR }}/data/interim/openalex/cluster_evidence/cluster_pairwise_evidence_guarded.jsonl
            ${{ env.PAPER_DIR }}/data/interim/openalex/cluster_evidence/cluster_guard_summary.json
            ${{ env.PAPER_DIR }}/data/interim/openalex/cluster_evidence/cluster_author_profiles.jsonl
            ${{ env.PAPER_DIR }}/data/interim/openalex/cluster_evidence/cluster_evidence_errors.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/identity_packet/accepted_author_profiles.jsonl
            ${{ env.PAPER_DIR }}/data/interim/openalex/identity_packet/all_author_profiles.jsonl
            ${{ env.PAPER_DIR }}/data/interim/openalex/identity_packet/wikidata_identity_evidence.jsonl
            ${{ env.PAPER_DIR }}/data/interim/openalex/identity_packet/wikidata_identity_summary.json
            ${{ env.PAPER_DIR }}/data/interim/openalex/identity_packet/identity_review_packet.jsonl
            ${{ env.PAPER_DIR }}/data/interim/openalex/identity_packet/IDENTITY_REVIEW_PACKET.md
            ${{ env.PAPER_DIR }}/data/interim/openalex/identity_packet/identity_review_packet_summary.json
          if-no-files-found: warn
          retention-days: 30
