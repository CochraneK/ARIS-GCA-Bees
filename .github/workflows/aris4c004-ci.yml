name: ARIS4C004 smoke gate

on:
  push:
    branches: [main]
    paths:
      - "papers/004-counterfactual-cost-of-exclusion/code/**"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/network100_person_work_decisions_v1.csv"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/network100_held_work_audit_sample.csv"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/network100_verified_work_summary.csv"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/network100_full_work_review_v1.csv"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/identity_decisions_100.csv"
      - "papers/004-counterfactual-cost-of-exclusion/process/EXPOSURE_CODEBOOK.md"
      - "papers/004-counterfactual-cost-of-exclusion/process/IDENTITY_CODEBOOK.md"
      - "papers/004-counterfactual-cost-of-exclusion/process/WORK_CODEBOOK.md"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/identity_decisions_pilot30.csv"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/work_decisions_pilot30.csv"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/work_decisions_network100_seed_v1.csv"
      - ".github/workflows/aris4c004-ci.yml"
  pull_request:
    paths:
      - "papers/004-counterfactual-cost-of-exclusion/code/**"
      - "papers/004-counterfactual-cost-of-exclusion/process/EXPOSURE_CODEBOOK.md"
      - "papers/004-counterfactual-cost-of-exclusion/process/IDENTITY_CODEBOOK.md"
      - "papers/004-counterfactual-cost-of-exclusion/process/WORK_CODEBOOK.md"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/identity_decisions_pilot30.csv"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/work_decisions_pilot30.csv"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/work_decisions_network100_seed_v1.csv"
      - ".github/workflows/aris4c004-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q papers/004-counterfactual-cost-of-exclusion/code
      - name: Run invariant test suite
        run: python -m unittest discover -s papers/004-counterfactual-cost-of-exclusion/code/tests -p 'test_*.py' -v
      - name: Validate frozen pilot30 identity decision table
        run: >-
          python papers/004-counterfactual-cost-of-exclusion/code/validate_identity.py
          papers/004-counterfactual-cost-of-exclusion/data/derived/identity_decisions_pilot30.csv
          --candidate-frame papers/004-counterfactual-cost-of-exclusion/data/derived/science_candidates_frozen.csv
      - name: Validate frozen pilot30 work decision table
        run: >-
          python papers/004-counterfactual-cost-of-exclusion/code/validate_work_decisions.py
          papers/004-counterfactual-cost-of-exclusion/data/derived/work_decisions_pilot30.csv
          --identity-decisions papers/004-counterfactual-cost-of-exclusion/data/derived/identity_decisions_pilot30.csv
      - name: Validate network100 person-level work release decisions
        run: >-
          python papers/004-counterfactual-cost-of-exclusion/code/validate_person_work_release.py
          --decisions papers/004-counterfactual-cost-of-exclusion/data/derived/network100_person_work_decisions_v1.csv
          --identities papers/004-counterfactual-cost-of-exclusion/data/derived/identity_decisions_100.csv
          --work-summary papers/004-counterfactual-cost-of-exclusion/data/derived/network100_verified_work_summary.csv
          --audit-sample papers/004-counterfactual-cost-of-exclusion/data/derived/network100_held_work_audit_sample.csv
          --prior-work-decisions papers/004-counterfactual-cost-of-exclusion/data/derived/work_decisions_pilot30.csv
          --full-work-review papers/004-counterfactual-cost-of-exclusion/data/derived/network100_full_work_review_v1.csv

      - name: Validate network100 evidence seed
        run: >-
          python papers/004-counterfactual-cost-of-exclusion/code/validate_work_decisions.py
          papers/004-counterfactual-cost-of-exclusion/data/derived/work_decisions_network100_seed_v1.csv
          --identity-decisions papers/004-counterfactual-cost-of-exclusion/data/derived/identity_decisions_100.csv
          --review-queue papers/004-counterfactual-cost-of-exclusion/data/derived/network100_held_work_audit_sample.csv
