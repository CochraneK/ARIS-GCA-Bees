name: ARIS4C006 corrected surname population baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-corrected-baseline.yml"
      - "papers/006-chinese-alphabetical-exposure/code/17_ccnc_corrected_population_baseline.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download pinned public surname sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PAPER_DIR/data/raw"
          curl -L --fail --retry 5 --retry-delay 2             "https://raw.githubusercontent.com/robertostling/chinese-names/main/src/chinese_names/data/familyname.csv"             -o "$PAPER_DIR/data/raw/familyname.csv"
          curl -L --fail --retry 5 --retry-delay 2             "https://raw.githubusercontent.com/jaaack-wang/ccnc/a14520b9cc8bd6b251aeb4a7453ab1a45f23aa15/Ch-Last-Names-Dict/ChineseLastNamesNoTones.json"             -o "$PAPER_DIR/data/raw/ccnc_lastnames.json"
          test "$(($(wc -l < "$PAPER_DIR/data/raw/familyname.csv") - 1))" -eq 1806
      - name: Build corrected population baseline
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          python code/17_ccnc_corrected_population_baseline.py             data/raw/familyname.csv             data/raw/ccnc_lastnames.json             --outdir data/pilot/corrected_population_baseline
      - name: Remove downloaded raw inputs
        if: always()
        working-directory: ${{ env.PAPER_DIR }}
        run: rm -rf data/raw
      - name: Upload public-safe corrected baseline
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-corrected-population-baseline
          path: |
            ${{ env.PAPER_DIR }}/data/pilot/corrected_population_baseline/corrected_initial_baseline.csv
            ${{ env.PAPER_DIR }}/data/pilot/corrected_population_baseline/romanized_population_map.csv
            ${{ env.PAPER_DIR }}/data/pilot/corrected_population_baseline/changed_initial_surnames.csv
            ${{ env.PAPER_DIR }}/data/pilot/corrected_population_baseline/excluded_rare_surnames.csv
            ${{ env.PAPER_DIR }}/data/pilot/corrected_population_baseline/manifest.json
          if-no-files-found: error
          retention-days: 30
