name: ARIS4C003 OpenAlex schema probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aris4c003-openalex-schema.yml"
      - "papers/003-colonial-disciplinary-advantage/code/probe_openalex_schema.py"

permissions:
  contents: write

jobs:
  schema-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: papers/003-colonial-disciplinary-advantage

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal probe dependency
        run: pip install "duckdb>=1.3"

      - name: Locate one official public Works Parquet object
        id: locate
        run: |
          KEY="$(aws s3 ls s3://openalex/data/parquet/works/ --recursive --no-sign-request \
            | awk '/\.parquet$/ {print $4; exit}')"
          test -n "$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Using schema-only object: s3://openalex/$KEY"

      - name: Bind frozen OpenAlex nested fields
        run: |
          python code/probe_openalex_schema.py \
            "s3://openalex/${{ steps.locate.outputs.key }}" \
            --output process/OPENALEX_SCHEMA_PROBE.json

      - name: Add public snapshot metadata
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path("process/OPENALEX_SCHEMA_PROBE.json")
          obj = json.loads(p.read_text())
          obj["checked_utc"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          obj["snapshot_prefix"] = "s3://openalex/data/parquet/works/"
          obj["access_mode"] = "anonymous public S3 range read via DuckDB httpfs"
          obj["outcomes_materialized"] = False
          obj["integrity_note"] = (
              "Schema/binding only. No country-by-discipline aggregate or "
              "substantive confirmatory result was computed."
          )
          p.write_text(json.dumps(obj, indent=2)+"\n", encoding="utf-8")
          print(json.dumps({
              "safe_to_build_extractor": obj["safe_to_build_extractor"],
              "source": obj["snapshot_root"],
          }, indent=2))
          PY

      - name: Commit schema-only audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add process/OPENALEX_SCHEMA_PROBE.json
          if git diff --cached --quiet; then
            echo "OpenAlex schema probe already current."
          else
            git commit -m "ARIS4C003 record outcome-blind OpenAlex schema probe"
            git push
          fi
