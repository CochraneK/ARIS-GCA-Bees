name: ARIS4C003 confirmatory recovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aris4c003-confirmatory-recovery.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: aris4c003-confirmatory-recovery
  cancel-in-progress: true

env:
  MATERIALIZATION_RUN_ID: "35436625005"
  DISTRIBUTED_SENSITIVITY_RUN_ID: "35438449846"

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: papers/003-colonial-disciplinary-advantage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: papers/003-colonial-disciplinary-advantage/code/requirements.txt

      - run: python -m pip install --upgrade pip && pip install -r code/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: aris4c003-analysis-panels
          path: papers/003-colonial-disciplinary-advantage
          run-id: ${{ env.MATERIALIZATION_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-run only the failed core component on latest main
        run: |
          mkdir -p data/results/components/core-recovery
          python code/run_confirmatory_component.py \
            --country-panel data/analysis/COUNTRY_DISCIPLINE_PANEL.parquet \
            --dyad-panel data/analysis/DYAD_DISCIPLINE_PANEL.parquet \
            --output-dir data/results/components/core-recovery \
            --component core
          test -s data/results/components/core-recovery/CORE_MODELS.csv
          test -s data/results/components/core-recovery/CORE_STATUS.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/results/components/core-recovery/CORE_STATUS.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x["status"]=="PASS", x
          print(json.dumps(x,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aris4c003-model-core-recovery
          path: papers/003-colonial-disciplinary-advantage/data/results/components/core-recovery
          retention-days: 30
          compression-level: 1

  permutation-shard3:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: papers/003-colonial-disciplinary-advantage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: papers/003-colonial-disciplinary-advantage/code/requirements.txt

      - run: python -m pip install --upgrade pip && pip install -r code/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: aris4c003-analysis-panels
          path: papers/003-colonial-disciplinary-advantage
          run-id: ${{ env.MATERIALIZATION_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-run only missing/slow permutation shard 3 on latest main
        shell: bash
        run: |
          set -euo pipefail
          out="data/results/components/perm-recovery-03"
          mkdir -p "$out"
          for model in output impact dyad; do
            python code/run_confirmatory_component.py \
              --country-panel data/analysis/COUNTRY_DISCIPLINE_PANEL.parquet \
              --dyad-panel data/analysis/DYAD_DISCIPLINE_PANEL.parquet \
              --output-dir "$out" \
              --component permutation \
              --model "$model" \
              --start-rep 151 \
              --end-rep 200
          done

      - uses: actions/upload-artifact@v4
        with:
          name: aris4c003-model-perm-recovery-3
          path: papers/003-colonial-disciplinary-advantage/data/results/components/perm-recovery-03
          retention-days: 30
          compression-level: 1

  aggregate:
    needs: [core, permutation-shard3]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: papers/003-colonial-disciplinary-advantage

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: papers/003-colonial-disciplinary-advantage/code/requirements.txt

      - run: python -m pip install --upgrade pip && pip install -r code/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: aris4c003-analysis-panels
          path: papers/003-colonial-disciplinary-advantage
          run-id: ${{ env.MATERIALIZATION_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: aris4c003-model-core-recovery
          path: papers/003-colonial-disciplinary-advantage/data/results/distributed
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: aris4c003-model-loo-*
          path: papers/003-colonial-disciplinary-advantage/data/results/distributed
          merge-multiple: true
          run-id: ${{ env.DISTRIBUTED_SENSITIVITY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: aris4c003-model-perm-*
          path: papers/003-colonial-disciplinary-advantage/data/results/distributed
          merge-multiple: true
          run-id: ${{ env.DISTRIBUTED_SENSITIVITY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace shard 3 with latest-code recovery output
        shell: bash
        run: |
          set -euo pipefail
          find data/results/distributed -type f \
            \( -name '*__IKES_PERMUTATION__0151_0200.csv' -o \
               -name '*__IKES_PERMUTATION__0151_0200.json' \) \
            -print -delete

      - uses: actions/download-artifact@v4
        with:
          name: aris4c003-model-perm-recovery-3
          path: papers/003-colonial-disciplinary-advantage/data/results/distributed
          merge-multiple: true

      - name: Aggregate under the original completeness gates
        run: |
          rm -rf data/results/confirmatory
          mkdir -p data/results/confirmatory
          python code/aggregate_confirmatory_components.py \
            --components-root data/results/distributed \
            --country-panel data/analysis/COUNTRY_DISCIPLINE_PANEL.parquet \
            --dyad-panel data/analysis/DYAD_DISCIPLINE_PANEL.parquet \
            --output-dir data/results/confirmatory

      - name: Record mixed-run execution provenance
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload={
            "paper":"ARIS4C003",
            "created_utc":datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
            "recovery_reason":"original distributed core failed only on fixed-effect demeaning convergence",
            "design_changed":False,
            "materialization_run_id":os.environ["MATERIALIZATION_RUN_ID"],
            "distributed_sensitivity_run_id":os.environ["DISTRIBUTED_SENSITIVITY_RUN_ID"],
            "recovered_permutation_range":"151-200 for all three headline models",
            "core_recovery_run_id":"${{ github.run_id }}",
            "core_recovery_head_sha":"${{ github.sha }}",
            "core_numerical_rule":"default MAP first; LSMR-within additive fallback only for explicit demeaning non-convergence",
            "aggregation_rule":"original completeness gates; exactly D01-D21 LOO and reps 1-999 with no failed refits; old shard 151-200 is removed before adding latest-code recovery shard; shard/core observed headline estimates must agree",
          }
          Path("data/results/confirmatory/RECOVERY_PROVENANCE.json").write_text(
            json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(payload,indent=2))
          PY

      - name: Run small-N imperial-center corroboration
        run: |
          rm -rf data/results/imperial_corroboration
          python code/run_imperial_corroboration.py \
            --country-cells data/derived/openalex/COUNTRY_DISCIPLINE_WINDOW.parquet \
            --output-dir data/results/imperial_corroboration

      - name: Lock first result package before human inspection
        run: |
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          roots=[
            Path("data/results/confirmatory"),
            Path("data/results/imperial_corroboration"),
          ]
          files=sorted(p for root in roots for p in root.rglob("*") if p.is_file())
          def sha(p):
            h=hashlib.sha256()
            with p.open("rb") as f:
              for b in iter(lambda:f.read(1<<20),b""): h.update(b)
            return h.hexdigest()
          payload={
            "paper":"ARIS4C003",
            "locked_utc":datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
            "source_materialization_run_id":"${{ env.MATERIALIZATION_RUN_ID }}",
            "source_distributed_sensitivity_run_id":"${{ env.DISTRIBUTED_SENSITIVITY_RUN_ID }}",
            "recovered_permutation_range":"151-200",
            "core_recovery_run_id":"${{ github.run_id }}",
            "core_recovery_head_sha":"${{ github.sha }}",
            "human_inspection_before_lock":False,
            "design_status":"DESIGN_LOCKED",
            "outcome_status":"OUTCOME_UNLOCKED",
            "files":{str(p):{"sha256":sha(p),"bytes":p.stat().st_size} for p in files},
          }
          out=Path("process/FIRST_RESULT_LOCK.json")
          out.write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"status":"LOCKED","files":len(files)},indent=2))
          PY

      - name: Commit compact frozen result package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/confirmatory
          git add data/results/imperial_corroboration
          git add process/FIRST_RESULT_LOCK.json
          if git diff --cached --quiet; then
            echo "Results already current."
          else
            git commit -m "ARIS4C003 recover and lock first confirmatory result package"
            pushed=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push; then pushed=1; break; fi
              sleep $((attempt*2))
            done
            test "$pushed" -eq 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aris4c003-first-results-recovery
          path: |
            papers/003-colonial-disciplinary-advantage/data/results/confirmatory
            papers/003-colonial-disciplinary-advantage/data/results/imperial_corroboration
            papers/003-colonial-disciplinary-advantage/process/FIRST_RESULT_LOCK.json
          retention-days: 90
          compression-level: 1
