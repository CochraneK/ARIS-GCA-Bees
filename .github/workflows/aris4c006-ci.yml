name: ARIS4C006 pre-outcome CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-ci.yml"
      - "papers/006-chinese-alphabetical-exposure/code/**"
      - "papers/006-chinese-alphabetical-exposure/process/**"
      - "papers/006-chinese-alphabetical-exposure/paper.json"
  pull_request:
    paths:
      - "papers/006-chinese-alphabetical-exposure/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python research code
        shell: bash
        run: |
          set -euo pipefail
          find "$PAPER_DIR/code" -maxdepth 1 -name '*.py' -print0 | xargs -0 -r -n1 python -m py_compile

      - name: Validate paper manifest and pre-outcome contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("papers/006-chinese-alphabetical-exposure")
          manifest = json.loads((root / "paper.json").read_text(encoding="utf-8"))
          assert manifest["id"] == "006"
          assert manifest["status"] in {"feasibility", "research-design", "preregistered", "analysis", "manuscript"}
          assert manifest["aris"]["version"] == "v0.4.26"

          required = [
              "RESEARCH_PLAN.md",
              "DATA_SOURCES.md",
              "LITERATURE_SEED.md",
              "CLOSEST_PRIOR_WORK.md",
              "AUTO_REVIEW.md",
              "CAUSAL_MODEL.md",
              "SURNAME_PARSING_PROTOCOL.md",
              "IDENTITY_RESOLUTION_AUDIT.md",
              "PREREGISTRATION_DRAFT.md",
              "EXPOSURE_ESTIMATOR.md",
              "COHORT_PROTOCOL.md",
              "STATUS.md",
              "DESIGN_GATES.json",
              "ANALYSIS_SPEC.json",
              "POPULATION_FRAME.md",
              "LOAO_EXPOSURE_RULE.md",
              "WORK_TYPE_RULE.md",
              "INFERENCE_RULE.md",
              "PUBLICATION_PLAN.md",
              "LONGITUDINAL_SAMPLING_RULE.md",
              "UNLOCK_PROTOCOL.md",
          ]
          missing = [x for x in required if not (root / "process" / x).exists()]
          assert not missing, f"missing required process files: {missing}"

          # Safety: confirmatory status cannot be opened while TBF items remain.
          prereg = (root / "process" / "PREREGISTRATION_DRAFT.md").read_text(encoding="utf-8")
          gates = json.loads((root / "process" / "DESIGN_GATES.json").read_text(encoding="utf-8"))
          analysis_spec = json.loads((root / "process" / "ANALYSIS_SPEC.json").read_text(encoding="utf-8"))
          assert analysis_spec["primary_exposure"]["context"] == "OpenAlex primary_topic field"
          assert analysis_spec["primary_exposure"]["lag_window_years"] == 3
          assert "primary_topic.field.id" in analysis_spec["primary_exposure"]["field_assignment_rule"]
          assert analysis_spec["primary_exposure"]["primary_source_level_exposure_forbidden"] is True
          assert "Tier3_last_token_heuristic" in analysis_spec["surname_measurement"]["forbidden"]
          assert analysis_spec["primary_model"]["work_fixed_effects"] is True
          assert analysis_spec["primary_frame"]["work_types"] == ["article", "conference-paper"]
          assert analysis_spec["primary_model"]["inference"]["cluster"] == ["canonical_author_id", "work_id", "primary_field_x_year"]
          assert "ChineseNames-mappable" in analysis_spec["primary_frame"]["population"]
          assert analysis_spec["primary_predictor"]["rank_reference"].startswith("entire actual author list")
          assert analysis_spec["downstream_longitudinal"]["sampling"]["status"] == "frozen_preoutcome"
          assert analysis_spec["downstream_longitudinal"]["sampling"]["minimum_structural_adequacy"]["validated_entry_authors"] == 1000
          assert analysis_spec["downstream_longitudinal"]["sampling"]["minimum_structural_adequacy"]["final_h3_authors"] == 750
          assert analysis_spec["downstream_longitudinal"]["sampling"]["minimum_structural_adequacy"]["entry_years_required"] == 7
          assert analysis_spec["downstream_longitudinal"]["sampling"]["minimum_structural_adequacy"]["entry_fields_required"] == 20
          # Locked design snapshots never flip their internal unlock booleans.
          assert analysis_spec.get("confirmatory_outcomes_unlocked") is False
          assert gates.get("confirmatory_outcomes_unlocked") is False

          lock_path = root / "process" / "PREREGISTRATION_LOCK.json"
          unlock_path = root / "process" / "CONFIRMATORY_UNLOCK.json"
          status = manifest["status"]

          if status == "research-design":
              assert not unlock_path.exists(), "research-design cannot have confirmatory unlock record"
          elif status == "preregistered":
              assert lock_path.exists(), "preregistered status requires PREREGISTRATION_LOCK.json"
              assert not unlock_path.exists(), "preregistered status must remain confirmatory-locked"
          elif status in {"analysis", "manuscript"}:
              assert lock_path.exists(), "analysis/manuscript requires PREREGISTRATION_LOCK.json"
              assert unlock_path.exists(), "analysis/manuscript requires CONFIRMATORY_UNLOCK.json"
              import subprocess, sys
              subprocess.run(
                  [sys.executable, str(root / "code" / "31_verify_prereg_lock.py"), "--require-unlock"],
                  check=True,
              )

          if status in {"preregistered", "analysis", "manuscript"}:
              assert "TBF" not in prereg, "cannot advance with unresolved TBF fields"
          print("ARIS4C006 pre-outcome contract OK")
          PY
