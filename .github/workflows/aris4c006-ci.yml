name: ARIS4C006 pre-outcome CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-ci.yml"
      - "papers/006-chinese-alphabetical-exposure/code/**"
      - "papers/006-chinese-alphabetical-exposure/process/**"
      - "papers/006-chinese-alphabetical-exposure/paper.json"
  pull_request:
    paths:
      - "papers/006-chinese-alphabetical-exposure/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python research code
        shell: bash
        run: |
          set -euo pipefail
          find "$PAPER_DIR/code" -maxdepth 1 -name '*.py' -print0 | xargs -0 -r -n1 python -m py_compile

      - name: Validate paper manifest and pre-outcome contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("papers/006-chinese-alphabetical-exposure")
          manifest = json.loads((root / "paper.json").read_text(encoding="utf-8"))
          assert manifest["id"] == "006"
          assert manifest["status"] in {"feasibility", "research-design", "preregistered", "analysis", "manuscript"}
          assert manifest["aris"]["version"] == "v0.4.26"

          required = [
              "RESEARCH_PLAN.md",
              "DATA_SOURCES.md",
              "LITERATURE_SEED.md",
              "CLOSEST_PRIOR_WORK.md",
              "AUTO_REVIEW.md",
              "CAUSAL_MODEL.md",
              "SURNAME_PARSING_PROTOCOL.md",
              "IDENTITY_RESOLUTION_AUDIT.md",
              "PREREGISTRATION_DRAFT.md",
              "EXPOSURE_ESTIMATOR.md",
              "COHORT_PROTOCOL.md",
              "STATUS.md",
          ]
          missing = [x for x in required if not (root / "process" / x).exists()]
          assert not missing, f"missing required process files: {missing}"

          # Safety: confirmatory status cannot be opened while TBF items remain.
          prereg = (root / "process" / "PREREGISTRATION_DRAFT.md").read_text(encoding="utf-8")
          if manifest["status"] in {"preregistered", "analysis", "manuscript"}:
              assert "TBF" not in prereg, "cannot advance to confirmatory analysis with unresolved TBF fields"
          print("ARIS4C006 pre-outcome contract OK")
          PY
