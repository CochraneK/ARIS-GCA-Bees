name: ARIS4C003 pre-outcome checks

on:
  workflow_dispatch:
  push:
    paths:
      - "papers/003-colonial-disciplinary-advantage/code/**"
      - "papers/003-colonial-disciplinary-advantage/process/**"
      - ".github/workflows/aris4c003-preoutcome.yml"
  pull_request:
    paths:
      - "papers/003-colonial-disciplinary-advantage/code/**"
      - "papers/003-colonial-disciplinary-advantage/process/**"
      - ".github/workflows/aris4c003-preoutcome.yml"

permissions:
  contents: read

jobs:
  preoutcome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: papers/003-colonial-disciplinary-advantage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: papers/003-colonial-disciplinary-advantage/code/requirements.txt

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && pip install -r code/requirements.txt

      - name: Compile all paper code
        run: python -m compileall -q code

      - name: Validate Coder B blind bundle
        run: python code/validate_coder_b_blind_bundle.py

      - name: OpenAlex manifest shard-plan integrity
        run: |
          rm -rf /tmp/aris4c003-openalex-shards
          python code/make_openalex_shards.py \
            data/manifests/openalex_works_manifest.json \
            --shards 32 \
            --output-dir /tmp/aris4c003-openalex-shards

      - name: Data-builder smoke tests
        run: python code/test_data_builders.py

      - name: IKES pipeline smoke test
        run: python code/test_ikes_pipeline.py

      - name: Distributed aggregation integrity test
        run: python code/test_distributed_aggregation.py

      - name: Legacy synthetic PPML sanity
        run: python code/simulate_ppml.py

      - name: Frozen PyFixest model-engine smoke test
        run: python code/test_model_engine.py

      - name: Assert design lock without opening outcomes
        run: python code/preoutcome_gate.py --require-design-locked
