name: ARIS4C006 primary frame probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-primary-frame-probe.yml"
      - "papers/006-chinese-alphabetical-exposure/code/24_materialize_primary_frame.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download frozen surname inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PAPER_DIR/data/raw"
          curl -L --fail --retry 5 --retry-delay 2             "https://raw.githubusercontent.com/robertostling/chinese-names/main/src/chinese_names/data/familyname.csv"             -o "$PAPER_DIR/data/raw/familyname.csv"
          curl -L --fail --retry 5 --retry-delay 2             "https://raw.githubusercontent.com/jaaack-wang/ccnc/a14520b9cc8bd6b251aeb4a7453ab1a45f23aa15/Ch-Last-Names-Dict/ChineseLastNamesNoTones.json"             -o "$PAPER_DIR/data/raw/ccnc_lastnames.json"
      - name: Materialize Mathematics primary-frame counts
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          python code/24_materialize_primary_frame.py             --field-id 26             --familyname-csv data/raw/familyname.csv             --ccnc-json data/raw/ccnc_lastnames.json             --target-works 40             --min-cell-works 20             --max-blocks 5             --outdir data/pilot/primary_frame_probe/field_26
      - name: Remove raw surname inputs
        if: always()
        working-directory: ${{ env.PAPER_DIR }}
        run: rm -rf data/raw
      - name: Upload outcome-locked frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-primary-frame-probe-field26
          path: ${{ env.PAPER_DIR }}/data/pilot/primary_frame_probe/field_26/
          if-no-files-found: error
          retention-days: 30
