name: ARIS4C006 OpenAlex author batch contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-openalex-author-batch.yml"
      - "papers/006-chinese-alphabetical-exposure/code/21_openalex_author_batch_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  author-batch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe OpenAlex author batch canonicalization
        working-directory: ${{ env.PAPER_DIR }}
        run: python code/21_openalex_author_batch_contract.py
      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-openalex-author-batch-contract
          path: ${{ env.PAPER_DIR }}/data/pilot/openalex_author_batch_contract/manifest.json
          if-no-files-found: error
          retention-days: 30
