name: ARIS4C007 vendor Péron S5 snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/007-vendor-peron.yml"
      - "papers/007-cross-species-age-equivalence/code/vendor_peron2019.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: aris4c007-vendor-peron
  cancel-in-progress: true

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned workbook reader
        run: python -m pip install "openpyxl==3.1.5"

      - name: Retrieve already-verified S5 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aris4c007-peron
          mkdir -p /tmp/aris4c007-peron
          gh run download 35300310780             --name aris4c007-peron2019-s5             --dir /tmp/aris4c007-peron
          test -s /tmp/aris4c007-peron/peron2019_s5.xlsx

      - name: Convert to canonical text snapshot
        run: |
          rm -rf /tmp/aris4c007-vendor
          mkdir -p /tmp/aris4c007-vendor
          python papers/007-cross-species-age-equivalence/code/vendor_peron2019.py             /tmp/aris4c007-peron/peron2019_s5.xlsx             --csv /tmp/aris4c007-vendor/peron2019_s5.csv             --provenance /tmp/aris4c007-vendor/peron2019_s5.provenance.json             --source-run-id 35300310780

      - name: Publish canonical snapshot safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p papers/007-cross-species-age-equivalence/data/sources
            cp /tmp/aris4c007-vendor/peron2019_s5.csv               papers/007-cross-species-age-equivalence/data/sources/peron2019_s5.csv
            cp /tmp/aris4c007-vendor/peron2019_s5.provenance.json               papers/007-cross-species-age-equivalence/data/sources/peron2019_s5.provenance.json

            git add papers/007-cross-species-age-equivalence/data/sources
            if git diff --cached --quiet; then
              echo "Canonical snapshot already current."
              exit 0
            fi

            git commit -m "data: vendor Péron 2019 S5 mortality parameters"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Failed to publish vendored S5 snapshot after retries." >&2
          exit 1
