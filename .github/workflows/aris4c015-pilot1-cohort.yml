name: ARIS4C015 Pilot 1 Historical Cohort

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c015-pilot1-cohort.yml"

permissions:
  contents: read

jobs:
  historical-cohort-multi-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run reproducible primary-field Physics & Astronomy cohort
        working-directory: papers/015-sleeping-beauty-miner/code
        run: |
          python pilot1_openalex_cohort.py \
            --sample-size 20 \
            --seed 15015 \
            --filters "publication_year:1980,type:article,primary_topic.field.id:31" \
            --cutoff-year 1995 \
            --observation-end-year 2011 \
            --beauty-fraction 0.20 \
            --acceleration-fraction 0.20 \
            --awakening-horizon-years 15 \
            --review-budget-k 5 \
            --output ../data/pilot1_openalex_1980_physics_primary_seed15015.json

      - name: Validate temporal split and outcome matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "papers/015-sleeping-beauty-miner/data/"
              "pilot1_openalex_1980_physics_primary_seed15015.json"
          )
          result = json.loads(path.read_text(encoding="utf-8"))

          assert result["benchmark_type"] == (
              "Pilot 1 non-hand-picked multi-outcome historical cohort"
          )
          assert result["sampling"]["seed"] == 15015
          assert result["sampling"]["sample_size_analyzed"] >= 10
          assert (
              "primary_topic.field.id:31"
              in result["sampling"]["filters"]
          )
          assert result["temporal_design"]["feature_cutoff_year"] == 1995
          assert (
              result["temporal_design"]["outcome_observation_end_year"]
              == 2011
          )
          assert (
              result["outcome_definitions"][
                  "universal_sleeping_beauty_definition"
              ]
              is False
          )

          expected_outcomes = {
              "beauty_percentile",
              "beauty_top_fraction",
              "future_acceleration_percentile",
              "awakening_within_horizon",
              "delayed_recognition_consensus",
          }
          matrix = result["outcome_baseline_matrix"]
          assert set(matrix) == expected_outcomes

          expected_strategies = {
              "current_citations",
              "momentum_3y",
              "acceleration_3y",
              "partial_beauty",
              "dormancy",
          }
          for rows in matrix.values():
              assert {row["strategy"] for row in rows} == expected_strategies

          print(json.dumps({
              "n": result["sampling"]["sample_size_analyzed"],
              "outcome_summary": result["outcome_summary"],
              "outcome_baseline_matrix": matrix,
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aris4c015-pilot1-openalex-1980-physics-primary
          path: papers/015-sleeping-beauty-miner/data/pilot1_openalex_1980_physics_primary_seed15015.json
          if-no-files-found: error
          retention-days: 30
