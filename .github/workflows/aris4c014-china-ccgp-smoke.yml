name: ARIS4C014 China CCGP Pilot 0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "papers/014-public-integrity-forensics/code/china_ccgp.py"
      - "papers/014-public-integrity-forensics/code/live_china_ccgp_smoke.py"
      - "papers/014-public-integrity-forensics/code/test_china_ccgp.py"
      - ".github/workflows/aris4c014-china-ccgp-smoke.yml"

permissions:
  contents: read

jobs:
  ccgp-source-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bounded public CCGP smoke
        working-directory: papers/014-public-integrity-forensics/code
        run: python live_china_ccgp_smoke.py

      - name: Upload source-feasibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c014-china-ccgp-pilot0
          path: papers/014-public-integrity-forensics/code/ccgp_pilot0.json
          retention-days: 30
