name: ARIS4C006 field36 hybrid completion

on:
  push:
    branches: [main]
    paths:
      - "papers/006-chinese-alphabetical-exposure/process/TRIGGER_FIELD36_HYBRID_COMPLETION"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  hybrid-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4

      - name: Download complete field36 convention from main repair
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: CochraneK/ARIS4C
          run-id: 35421412480
          name: aris4c006-field36-repair-convention
          path: ${{ env.PAPER_DIR }}/data/field36_hybrid/convention/full

      - name: Download fast p1
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: CochraneK/ARIS4C
          run-id: 35423964580
          name: aris4c006-field36-fallback-primary-p1
          path: ${{ env.PAPER_DIR }}/data/field36_hybrid/primary/p1

      - name: Download fast p2
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: CochraneK/ARIS4C
          run-id: 35423964580
          name: aris4c006-field36-fallback-primary-p2
          path: ${{ env.PAPER_DIR }}/data/field36_hybrid/primary/p2

      - name: Download completed p3 from original chunked run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: CochraneK/ARIS4C
          run-id: 35423538023
          name: aris4c006-field36-fallback-primary-p3
          path: ${{ env.PAPER_DIR }}/data/field36_hybrid/primary/p3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Strictly merge field36 pieces under frozen rules
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          python code/33_merge_field36_chunked.py \
            --convention-root data/field36_hybrid/convention \
            --primary-root data/field36_hybrid/primary \
            --convention-out data/field36_hybrid/merged/convention \
            --primary-out data/field36_hybrid/merged/primary

      - name: Upload standard field36 convention artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-field36-repair-convention
          path: ${{ env.PAPER_DIR }}/data/field36_hybrid/merged/convention/
          if-no-files-found: error
          retention-days: 30

      - name: Upload standard field36 primary-frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-field36-repair-primary-frame
          path: ${{ env.PAPER_DIR }}/data/field36_hybrid/merged/primary/
          if-no-files-found: error
          retention-days: 30
