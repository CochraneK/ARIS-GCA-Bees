name: ARIS4C006 verify ChineseNames R package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-chinesenames-r.yml"
      - "papers/006-chinese-alphabetical-exposure/code/18_verify_chinesenames_r_package.R"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"

      - name: Download official ChineseNames 2025.8 source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PAPER_DIR/data/raw/pkg"
          curl -L --fail --retry 5 --retry-delay 2             "https://psychbruce.r-universe.dev/src/contrib/ChineseNames_2025.8.tar.gz"             -o "$PAPER_DIR/data/raw/ChineseNames_2025.8.tar.gz"
          sha256sum "$PAPER_DIR/data/raw/ChineseNames_2025.8.tar.gz" | tee "$PAPER_DIR/data/raw/source_tarball.sha256"
          tar -xzf "$PAPER_DIR/data/raw/ChineseNames_2025.8.tar.gz" -C "$PAPER_DIR/data/raw/pkg"
          test -f "$PAPER_DIR/data/raw/pkg/ChineseNames/DESCRIPTION"

      - name: Download engineering mirror
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2             "https://raw.githubusercontent.com/robertostling/chinese-names/main/src/chinese_names/data/familyname.csv"             -o "$PAPER_DIR/data/raw/familyname.csv"
          test "$(($(wc -l < "$PAPER_DIR/data/raw/familyname.csv") - 1))" -eq 1806

      - name: Verify official source package against mirror
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          Rscript code/18_verify_chinesenames_r_package.R             data/raw/pkg/ChineseNames             data/raw/familyname.csv             data/pilot/chinesenames_r_verify
          cp data/raw/source_tarball.sha256 data/pilot/chinesenames_r_verify/source_tarball.sha256

      - name: Remove downloaded package/mirror
        if: always()
        working-directory: ${{ env.PAPER_DIR }}
        run: rm -rf data/raw

      - name: Upload provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-chinesenames-r-verify
          path: |
            ${{ env.PAPER_DIR }}/data/pilot/chinesenames_r_verify/manifest.json
            ${{ env.PAPER_DIR }}/data/pilot/chinesenames_r_verify/familyname_from_source_package.csv
            ${{ env.PAPER_DIR }}/data/pilot/chinesenames_r_verify/source_tarball.sha256
          if-no-files-found: error
          retention-days: 30
