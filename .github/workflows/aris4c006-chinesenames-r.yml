name: ARIS4C006 verify ChineseNames R package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-chinesenames-r.yml"
      - "papers/006-chinese-alphabetical-exposure/code/18_verify_chinesenames_r_package.R"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"

      - name: Install ChineseNames from R-universe
        shell: bash
        run: |
          Rscript -e 'options(repos=c(psychbruce="https://psychbruce.r-universe.dev", CRAN="https://cloud.r-project.org")); install.packages("ChineseNames", dependencies=NA)'
          Rscript -e 'v <- as.character(packageVersion("ChineseNames")); cat("ChineseNames version:",v,"\n"); stopifnot(v=="2025.8")'

      - name: Download engineering mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PAPER_DIR/data/raw"
          curl -L --fail --retry 5 --retry-delay 2             "https://raw.githubusercontent.com/robertostling/chinese-names/main/src/chinese_names/data/familyname.csv"             -o "$PAPER_DIR/data/raw/familyname.csv"
          test "$(($(wc -l < "$PAPER_DIR/data/raw/familyname.csv") - 1))" -eq 1806

      - name: Verify package familyname against mirror
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          Rscript code/18_verify_chinesenames_r_package.R             data/raw/familyname.csv             data/pilot/chinesenames_r_verify

      - name: Remove downloaded mirror
        if: always()
        working-directory: ${{ env.PAPER_DIR }}
        run: rm -rf data/raw

      - name: Upload provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-chinesenames-r-verify
          path: |
            ${{ env.PAPER_DIR }}/data/pilot/chinesenames_r_verify/manifest.json
            ${{ env.PAPER_DIR }}/data/pilot/chinesenames_r_verify/familyname_from_package.csv
          if-no-files-found: error
          retention-days: 30
