name: Language geometry Stage 1D

on:
  push:
    branches:
      - research/language-geometry-confirmatory
    paths:
      - 'ideas/language-periodic-system/stage1.py'
      - 'ideas/language-periodic-system/stage1b.py'
      - 'ideas/language-periodic-system/stage1d.py'
      - '.github/workflows/language-geometry-stage1d.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: language-geometry-stage1d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage1d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn
      - name: Run Stage-1D circular-Robinson sensitivity
        run: python ideas/language-periodic-system/stage1d.py
      - name: Commit Stage-1D outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideas/language-periodic-system/STAGE1D_REPORT.md ideas/language-periodic-system/stage1d-results.json
          if git diff --cached --quiet; then
            echo "No Stage-1D output changes"
            exit 0
          fi
          git commit -m "research: record Stage-1D circular-Robinson sensitivity"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

# Triggered after workflow registration on branch.
