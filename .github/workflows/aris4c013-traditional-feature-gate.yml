name: ARIS4C013 traditional feature/model gates

on:
  push:
    branches: [main]
    paths:
      - 'papers/013-birth-death-temporal-coupling/process/TRADITIONAL_FEATURE_SCHEMA.json'
      - 'papers/013-birth-death-temporal-coupling/process/TRADITIONAL_MODEL_SCHEMA.json'
      - 'papers/013-birth-death-temporal-coupling/code/traditional_feature_gate.py'
      - 'papers/013-birth-death-temporal-coupling/code/traditional_model_gate.py'
      - 'papers/013-birth-death-temporal-coupling/code/test_traditional_feature_gate.py'
      - 'papers/013-birth-death-temporal-coupling/code/test_traditional_model_gate.py'
      - '.github/workflows/aris4c013-traditional-feature-gate.yml'
  pull_request:
    paths:
      - 'papers/013-birth-death-temporal-coupling/process/TRADITIONAL_FEATURE*'
      - 'papers/013-birth-death-temporal-coupling/process/TRADITIONAL_MODEL*'
      - 'papers/013-birth-death-temporal-coupling/code/traditional_feature_gate.py'
      - 'papers/013-birth-death-temporal-coupling/code/traditional_model_gate.py'
      - 'papers/013-birth-death-temporal-coupling/code/test_traditional_feature_gate.py'
      - 'papers/013-birth-death-temporal-coupling/code/test_traditional_model_gate.py'
      - '.github/workflows/aris4c013-traditional-feature-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and test gates
        working-directory: papers/013-birth-death-temporal-coupling/code
        run: |
          python -m py_compile traditional_feature_gate.py traditional_model_gate.py
          python -m unittest -v             test_traditional_feature_gate.py             test_traditional_model_gate.py

      - name: Assert feature layer is frozen and hash-clean
        working-directory: papers/013-birth-death-temporal-coupling/code
        run: |
          python traditional_feature_gate.py             --schema ../process/TRADITIONAL_FEATURE_SCHEMA.json

      - name: Assert H3/H4 outcome model remains locked
        working-directory: papers/013-birth-death-temporal-coupling/code
        shell: bash
        run: |
          set +e
          python traditional_model_gate.py             --feature-schema ../process/TRADITIONAL_FEATURE_SCHEMA.json             --model-schema ../process/TRADITIONAL_MODEL_SCHEMA.json
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected H3/H4 model gate to remain locked; got $code"
            exit 1
          fi
          echo "Feature layer frozen; H3/H4 outcome analysis correctly remains locked."
