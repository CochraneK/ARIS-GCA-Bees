name: ARIS4C010 CI

on:
  push:
    paths:
      - "papers/010-universal-concept-identification/code/**/*.py"
      - "papers/010-universal-concept-identification/data/**/*.json"
      - ".github/workflows/aris4c010-ci.yml"
  pull_request:
    paths:
      - "papers/010-universal-concept-identification/code/**/*.py"
      - "papers/010-universal-concept-identification/data/**/*.json"
      - ".github/workflows/aris4c010-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-010:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: papers/010-universal-concept-identification/code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned lexical dependency
        run: python -m pip install "wn==1.1.1"

      - name: Compile all Python tools
        run: python -m py_compile *.py

      - name: Unit tests
        run: python -m unittest -v test_query_complexity.py

      - name: Validate constructed seed
        run: python validate_seed_data.py

      - name: Check seed leakage splits
        run: python check_seed_splits.py

      - name: Run combinatorial Pilot 0
        run: python query_complexity.py

      - name: Run synthetic semantic Pilot 1
        run: python pilot1_semantic_seed.py

      - name: Run OEWN lexical Pilot 2
        run: python pilot2_oewn_lexical.py

      - name: Build pinned OEWN calibration60 source pool
        run: python build_oewn_calibration60.py

      - name: Validate calibration60
        run: python validate_calibration60.py

      - name: Build human annotation packets
        run: python build_calibration_annotation_packet.py

      - name: Build mixed P6 calibration packet
        run: python build_mixed_p6_calibration.py

      - name: Build balanced human participant forms
        run: python build_human_forms.py

      - name: Validate human participant forms
        run: python validate_human_forms.py

      - name: Export human forms to CSV
        run: python export_human_forms_csv.py

      - name: Dry-run human analysis pipeline
        run: python dryrun_human_analysis.py

      - name: Run retest power sensitivity
        run: python power_retest_scenarios.py

      - name: Build standalone annotation HTML
        run: python build_annotation_html.py

      - name: Validate standalone annotation HTML
        run: python validate_annotation_html.py

      - name: Upload calibration60 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aris4c010-calibration60
          path: |
            papers/010-universal-concept-identification/data/calibration60/oewn_source_pool.generated.json
            papers/010-universal-concept-identification/data/calibration60/full_matrix.generated.json
            papers/010-universal-concept-identification/data/calibration60/calibration_subset.generated.json
          if-no-files-found: error

      - name: Upload mixed P6 calibration artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c010-mixed-p6-calibration
          path: papers/010-universal-concept-identification/data/mixed_calibration/annotation_packet.generated.json
          if-no-files-found: error

      - name: Upload human form artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c010-human-forms
          path: |
            papers/010-universal-concept-identification/data/human_forms/forms.generated.json
            papers/010-universal-concept-identification/data/human_forms/csv/
          if-no-files-found: error

      - name: Upload standalone annotation UI
        uses: actions/upload-artifact@v4
        with:
          name: aris4c010-standalone-ui
          path: papers/010-universal-concept-identification/data/human_forms/html/
          if-no-files-found: error
