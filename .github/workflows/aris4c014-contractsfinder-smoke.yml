name: ARIS4C014 Contracts Finder coverage smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "papers/014-public-integrity-forensics/code/live_uk_contractsfinder_smoke.py"
      - "papers/014-public-integrity-forensics/code/source_adapters.py"
      - ".github/workflows/aris4c014-contractsfinder-smoke.yml"

permissions:
  contents: read

jobs:
  contracts-finder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Measure Contracts Finder identifier and competition coverage
        working-directory: papers/014-public-integrity-forensics/code
        run: python live_uk_contractsfinder_smoke.py --out contracts_finder_smoke.json --days 30 --limit 50 --record-sample 5

      - name: Upload coverage output
        uses: actions/upload-artifact@v4
        with:
          name: aris4c014-contractsfinder-smoke
          path: papers/014-public-integrity-forensics/code/contracts_finder_smoke.json
          retention-days: 14
