name: ARIS4C004 clean-network pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c004-network.yml"
      - "papers/004-counterfactual-cost-of-exclusion/code/network/**"
      - "papers/004-counterfactual-cost-of-exclusion/code/validate_work_decisions.py"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/identity_decisions_pilot30.csv"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/work_decisions_pilot30.csv"
      - "papers/004-counterfactual-cost-of-exclusion/process/WORK_CODEBOOK.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPER_DIR: papers/004-counterfactual-cost-of-exclusion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build verified-person work corpus with network metadata
        run: |
          python "$PAPER_DIR/code/network/build_verified_work_corpus.py" \
            --decisions "$PAPER_DIR/data/derived/identity_decisions_pilot30.csv" \
            --out-dir "$PAPER_DIR/data/interim/openalex/verified_work_corpus" \
            --fetch-year-min 1800 \
            --fetch-year-max 2026 \
            --max-works-per-id 500 \
            --min-network-works 5 \
            --sleep-rps 2

      - name: Validate frozen work decisions against regenerated queue
        run: |
          python "$PAPER_DIR/code/validate_work_decisions.py" \
            "$PAPER_DIR/data/derived/work_decisions_pilot30.csv" \
            --identity-decisions "$PAPER_DIR/data/derived/identity_decisions_pilot30.csv" \
            --review-queue "$PAPER_DIR/data/interim/openalex/verified_work_corpus/work_review_queue.csv" \
            --require-complete-queue

      - name: Build clean pre-exposure network frame
        run: |
          python "$PAPER_DIR/code/network/build_clean_network_frame.py" \
            --corpus "$PAPER_DIR/data/interim/openalex/verified_work_corpus/verified_work_corpus.jsonl" \
            --identities "$PAPER_DIR/data/derived/identity_decisions_pilot30.csv" \
            --work-decisions "$PAPER_DIR/data/derived/work_decisions_pilot30.csv" \
            --out-dir "$PAPER_DIR/data/interim/openalex/clean_network"

      - name: Acquire bounded downstream citation neighborhoods
        run: |
          python "$PAPER_DIR/code/network/acquire_downstream_neighborhood.py" \
            --clean-corpus "$PAPER_DIR/data/interim/openalex/clean_network/clean_work_corpus.jsonl" \
            --out-dir "$PAPER_DIR/data/interim/openalex/downstream_network" \
            --anchors-per-person 6 \
            --horizon-years 20 \
            --study-end-year 2026 \
            --max-citers-per-anchor 50 \
            --sleep-rps 2

      - name: Print clean-network summary
        run: cat "$PAPER_DIR/data/interim/openalex/clean_network/clean_network_overall.json"
      - name: Print downstream-neighborhood summary
        run: cat "$PAPER_DIR/data/interim/openalex/downstream_network/downstream_overall.json"

      - name: Print downstream person summary
        run: cat "$PAPER_DIR/data/interim/openalex/downstream_network/downstream_person_summary.csv"


      - name: Upload clean-network artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c004-clean-network
          path: |
            ${{ env.PAPER_DIR }}/data/interim/openalex/verified_work_corpus/verified_work_overall.json
            ${{ env.PAPER_DIR }}/data/interim/openalex/verified_work_corpus/verified_work_summary.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/verified_work_corpus/work_review_queue.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/verified_work_corpus/verified_work_corpus.jsonl
            ${{ env.PAPER_DIR }}/data/interim/openalex/clean_network/clean_work_corpus.jsonl
            ${{ env.PAPER_DIR }}/data/interim/openalex/clean_network/clean_person_network_summary.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/clean_network/internal_citation_edges.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/clean_network/citation_temporal_anomalies.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/clean_network/clean_network_overall.json
            ${{ env.PAPER_DIR }}/data/interim/openalex/downstream_network/downstream_edges.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/downstream_network/downstream_works.jsonl
            ${{ env.PAPER_DIR }}/data/interim/openalex/downstream_network/downstream_anchor_summary.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/downstream_network/downstream_person_summary.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/downstream_network/downstream_temporal_anomalies.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/downstream_network/downstream_errors.csv
            ${{ env.PAPER_DIR }}/data/interim/openalex/downstream_network/downstream_overall.json
          if-no-files-found: error
          retention-days: 30
