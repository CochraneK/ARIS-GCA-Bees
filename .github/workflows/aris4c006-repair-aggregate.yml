name: ARIS4C006 aggregate field36 repair

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ARIS4C006 field36 repair build", "ARIS4C006 field36 chunked fallback", "ARIS4C006 field36 hybrid completion"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "papers/006-chinese-alphabetical-exposure/process/TRIGGER_REPAIR_AGGREGATE"

permissions:
  actions: read
  contents: read

jobs:
  aggregate-repair:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
      FIELD36_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 35421412480 }}
    steps:
      - uses: actions/checkout@v4

      - name: Download original 25 convention field artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: CochraneK/ARIS4C
          run-id: 35417181411
          pattern: aris4c006-final-convention-field-*
          path: ${{ env.PAPER_DIR }}/data/repair_aggregate/convention
      - name: Download repaired field36 convention
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: CochraneK/ARIS4C
          run-id: ${{ env.FIELD36_RUN_ID }}
          name: aris4c006-field36-repair-convention
          path: ${{ env.PAPER_DIR }}/data/repair_aggregate/convention/field36_repair

      - name: Download original 25 primary-frame field artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: CochraneK/ARIS4C
          run-id: 35417184958
          pattern: aris4c006-primary-frame-field-*
          path: ${{ env.PAPER_DIR }}/data/repair_aggregate/primary_frame
      - name: Download repaired field36 primary frame
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: CochraneK/ARIS4C
          run-id: ${{ env.FIELD36_RUN_ID }}
          name: aris4c006-field36-repair-primary-frame
          path: ${{ env.PAPER_DIR }}/data/repair_aggregate/primary_frame/field36_repair

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggregate repaired 26-field convention
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          python code/23_aggregate_final_convention.py \
            data/repair_aggregate/convention \
            --outdir data/repair_aggregate/convention_aggregate

      - name: Aggregate repaired 26-field primary frame
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          python code/25_aggregate_primary_frame.py \
            data/repair_aggregate/primary_frame \
            --outdir data/repair_aggregate/primary_frame_aggregate

      - name: Upload repaired aggregate convention
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-final-convention-aggregate-repaired
          path: ${{ env.PAPER_DIR }}/data/repair_aggregate/convention_aggregate/
          if-no-files-found: error
          retention-days: 30

      - name: Download identity-risk prevalence artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: CochraneK/ARIS4C
          run-id: 35421240300
          name: aris4c006-identity-risk-prevalence
          path: ${{ env.PAPER_DIR }}/data/repair_aggregate/identity_risk

      - name: Evaluate frozen execution gates
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          python code/28_evaluate_execution_gates.py \
            --convention-manifest data/repair_aggregate/convention_aggregate/manifest.json \
            --primary-frame-manifest data/repair_aggregate/primary_frame_aggregate/manifest.json \
            --identity-manifest data/repair_aggregate/identity_risk/manifest.json \
            --convention-rolling-csv data/repair_aggregate/convention_aggregate/rolling_exposure_all_fields.csv \
            --primary-frame-counts-csv data/repair_aggregate/primary_frame_aggregate/field_year_counts_all_fields.csv \
            --out data/repair_aggregate/execution_gate_evaluation.json

      - name: Upload repaired aggregate primary frame
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-primary-frame-aggregate-repaired
          path: ${{ env.PAPER_DIR }}/data/repair_aggregate/primary_frame_aggregate/
          if-no-files-found: error
          retention-days: 30

      - name: Upload frozen execution-gate evaluation
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-execution-gate-evaluation-repaired
          path: ${{ env.PAPER_DIR }}/data/repair_aggregate/execution_gate_evaluation.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate candidate prelock promotion files
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          python code/32_promote_prelock_gates.py \
            --evaluation data/repair_aggregate/execution_gate_evaluation.json \
            --aggregate-run-id ${{ github.run_id }} \
            --apply

      - name: Upload candidate prelock promotion files
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-prelock-promotion-candidate
          path: |
            ${{ env.PAPER_DIR }}/process/DESIGN_GATES.json
            ${{ env.PAPER_DIR }}/process/PREREGISTRATION_DRAFT.md
            ${{ env.PAPER_DIR }}/process/STATUS.md
          if-no-files-found: error
          retention-days: 30
