name: ARIS4C007 Pilot 3C clock-era molecular smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/007-pilot3c-clockera-smoke.yml"
      - "papers/007-cross-species-age-equivalence/code/prepare_pilot3c_smoke.py"
      - "papers/007-cross-species-age-equivalence/code/run_pilot3c_sesame_clocks.R"

permissions:
  contents: read
  actions: read

concurrency:
  group: aris4c007-pilot3c-clockera-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"

      - name: Install clock-era SeSAMe stack
        shell: Rscript {0}
        run: |
          install.packages("BiocManager", repos="https://cloud.r-project.org")
          BiocManager::install(version="3.17", ask=FALSE)
          BiocManager::install(c("sesame","sesameData"), ask=FALSE, update=FALSE)

          # SHCDPM's design-matching step calls RPMM::blc. RPMM was a
          # Bioconductor dependency in the 2023-era SeSAMe stack but is not
          # installed by the minimal runtime dependency set.
          BiocManager::install("RPMM", ask=FALSE, update=FALSE)

          # Bioconductor 3.17/3.18 era AnnotationHub/BiocFileCache code calls
          # collect(Inf), which became incompatible with dbplyr >=2.4.0.
          # Pin the last pre-breakage dbplyr release to reproduce the 2023
          # software stack rather than patch old Bioconductor internals.
          install.packages("remotes", repos="https://cloud.r-project.org")
          remotes::install_version(
            "dbplyr",
            version="2.3.4",
            repos="https://cloud.r-project.org",
            upgrade="never"
          )

          # Keep the same Linux CI safeguard used by the modern smoke.
          BiocManager::install(
            "preprocessCore",
            ask=FALSE,
            update=FALSE,
            force=TRUE,
            type="source",
            configure.args="--disable-threading"
          )

          stopifnot(requireNamespace("sesame", quietly=TRUE))
          stopifnot(requireNamespace("sesameData", quietly=TRUE))
          stopifnot(requireNamespace("preprocessCore", quietly=TRUE))
          stopifnot(requireNamespace("RPMM", quietly=TRUE))
          cat("R=", R.version.string, "\n")
          cat("Bioconductor=", as.character(BiocManager::version()), "\n")
          cat("sesame=", as.character(packageVersion("sesame")), "\n")
          cat("sesameData=", as.character(packageVersion("sesameData")), "\n")
          cat("dbplyr=", as.character(packageVersion("dbplyr")), "\n")
          cat("preprocessCore=", as.character(packageVersion("preprocessCore")), "\n")
          cat("RPMM=", as.character(packageVersion("RPMM")), "\n")

          # The public Bioconductor 3.17 archive corresponding to the
          # 2023 Universal Clock release reports SeSAMe 1.18.4.
          stopifnot(as.character(packageVersion("sesame")) == "1.18.4")
          stopifnot(as.character(packageVersion("dbplyr")) == "2.3.4")
          stopifnot("sesameDataCache" %in% getNamespaceExports("sesameData"))
          sesameData::sesameDataCache()
          cat("clock-era sesameData cache PASS\n")

          probe <- matrix(seq_len(200), nrow=20, ncol=10)
          target <- sort(rowMeans(probe))
          invisible(preprocessCore::normalize.quantiles.use.target(probe, target))
          cat("clock-era preprocessCore smoke PASS\n")

      - name: Resolve canonical Pilot 0 and Pilot 3B artifacts
        working-directory: papers/007-cross-species-age-equivalence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/upstream/pilot0 data/upstream/pilot3b

          P0="$(gh run list --workflow 007-pilot0.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          P3B="$(gh run list --workflow 007-pilot3b-geo-metadata.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$P0"
          test -n "$P3B"

          gh run download "$P0" --name aris4c007-pilot0 --dir data/upstream/pilot0
          gh run download "$P3B" --name aris4c007-pilot3b-geo-metadata --dir data/upstream/pilot3b
          gh run view "$P3B" --json databaseId,headSha,createdAt,url,conclusion,workflowName > data/upstream/pilot3b_run.json

          test -s data/upstream/pilot3b/bounded_independent_panclock_holdout.csv
          test -s data/upstream/pilot0/pilot0/life_history_mapping_grid.csv

      - name: Prepare the same deterministic 10-sample smoke set
        working-directory: papers/007-cross-species-age-equivalence
        run: |
          rm -rf data/pilot3c_clockera_smoke
          python code/prepare_pilot3c_smoke.py             --holdout data/upstream/pilot3b/bounded_independent_panclock_holdout.csv             --pilot0-grid data/upstream/pilot0/pilot0/life_history_mapping_grid.csv             --pilot0-coverage data/upstream/pilot0/pilot0/coverage_summary.json             --out data/pilot3c_clockera_smoke             --per-species 2
          cat data/pilot3c_clockera_smoke/prep_summary.json

      - name: Download bounded raw IDAT pairs
        working-directory: papers/007-cross-species-age-equivalence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/pilot3c_clockera_smoke/idats
          tail -n +2 data/pilot3c_clockera_smoke/download_manifest.tsv | while IFS=$'\t' read -r gsm species url filename; do
            echo "Downloading $gsm $filename"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30               "$url" -o "data/pilot3c_clockera_smoke/idats/$filename"
            test -s "data/pilot3c_clockera_smoke/idats/$filename"
          done

          EXPECTED="$(tail -n +2 data/pilot3c_clockera_smoke/download_manifest.tsv | wc -l)"
          ACTUAL="$(find data/pilot3c_clockera_smoke/idats -type f -name '*.idat.gz' | wc -l)"
          test "$ACTUAL" -eq "$EXPECTED"
          echo "Downloaded gzipped IDAT files: $ACTUAL"

      - name: Fetch pinned MMC v3.0.0 Clock 2/3 coefficients
        working-directory: papers/007-cross-species-age-equivalence
        run: |
          mkdir -p data/pilot3c_clockera_smoke/mmc
          BASE="https://raw.githubusercontent.com/shorvath/MammalianMethylationConsortium/44f3329fd593b472c2b6d021d764c9d7e5681f88/UniversalPanMammalianClock/ClockParameters"
          curl -fL "$BASE/clock2.csv" -o data/pilot3c_clockera_smoke/mmc/clock2.csv
          curl -fL "$BASE/clock3.csv" -o data/pilot3c_clockera_smoke/mmc/clock3.csv
          sha256sum data/pilot3c_clockera_smoke/mmc/*.csv > data/pilot3c_clockera_smoke/mmc/sha256.txt
          cat data/pilot3c_clockera_smoke/mmc/sha256.txt

      - name: Reproduce 2023 Mammal40 SHCDPM preprocessing
        working-directory: papers/007-cross-species-age-equivalence
        run: |
          cd data/pilot3c_clockera_smoke
          Rscript ../../code/run_pilot3c_sesame_clocks.R             idats             smoke_sample.csv             species_traits.csv             mmc/clock2.csv             mmc/clock3.csv             download_manifest.tsv             SHCDPM
          cat pilot3c_summary.csv

      - name: Record clock-era environment
        if: always()
        working-directory: papers/007-cross-species-age-equivalence
        shell: bash
        run: |
          mkdir -p data/pilot3c_clockera_smoke
          Rscript -e 'writeLines(capture.output(sessionInfo()), "data/pilot3c_clockera_smoke/R_sessionInfo.txt")'
          if [ -s data/upstream/pilot3b_run.json ]; then
            cp data/upstream/pilot3b_run.json data/pilot3c_clockera_smoke/upstream_pilot3b_run.json
          fi

      - name: Upload clock-era smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aris4c007-pilot3c-clockera-smoke
          path: |
            papers/007-cross-species-age-equivalence/data/pilot3c_clockera_smoke/prep_summary.json
            papers/007-cross-species-age-equivalence/data/pilot3c_clockera_smoke/smoke_sample.csv
            papers/007-cross-species-age-equivalence/data/pilot3c_clockera_smoke/species_traits.csv
            papers/007-cross-species-age-equivalence/data/pilot3c_clockera_smoke/mmc/sha256.txt
            papers/007-cross-species-age-equivalence/data/pilot3c_clockera_smoke/pilot3c_predictions.csv
            papers/007-cross-species-age-equivalence/data/pilot3c_clockera_smoke/pilot3c_probe_coverage_diagnostics.csv
            papers/007-cross-species-age-equivalence/data/pilot3c_clockera_smoke/pilot3c_summary.csv
            papers/007-cross-species-age-equivalence/data/pilot3c_clockera_smoke/R_sessionInfo.txt
            papers/007-cross-species-age-equivalence/data/pilot3c_clockera_smoke/upstream_pilot3b_run.json
          if-no-files-found: warn
          retention-days: 30
