name: ARIS4C005 Sleeping Beauty pilot

on:
  push:
    branches:
      - main
      - aris4c005-sleeping-beauty-20260918
      - aris4c005-sleeping-beauty-final-20260918
      - aris4c005-sb-landmark-20260919
      - aris4c005-sb1-baseline-20260919
    paths:
      - ".github/workflows/aris4c005-sleeping-beauty.yml"
      - "papers/005-hidden-burden-bad-science/code/sleeping_beauty.py"
      - "papers/005-hidden-burden-bad-science/code/build_sleeping_beauty_pilot.py"
      - "papers/005-hidden-burden-bad-science/code/build_sb_landmark_dataset.py"
      - "papers/005-hidden-burden-bad-science/code/sb1_baseline.py"
      - "papers/005-hidden-burden-bad-science/code/tests/test_sleeping_beauty.py"
      - "papers/005-hidden-burden-bad-science/code/tests/test_sb_landmark_dataset.py"
      - "papers/005-hidden-burden-bad-science/code/tests/test_sb1_baseline.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aris4c005-sleeping-beauty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PAPER_DIR: papers/005-hidden-burden-bad-science

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and test
        run: |
          python -m compileall -q "$PAPER_DIR/code"
          python -m unittest discover -s "$PAPER_DIR/code/tests" -p 'test_*.py' -v

      - name: Build mature historical delayed-recognition pilot
        run: |
          python "$PAPER_DIR/code/build_sleeping_beauty_pilot.py" \
            "$RUNNER_TEMP/aris4c005_sb_history.csv" \
            "$RUNNER_TEMP/aris4c005_sb_metrics.csv" \
            "$PAPER_DIR/data/pilot/sleeping_beauty_pilot_summary.json" \
            --start 1990 \
            --end 2005 \
            --sample-n 200 \
            --seed 20260918 \
            --observation-end-year 2025

      - name: Build leakage-safe landmark dataset
        run: |
          python "$PAPER_DIR/code/build_sb_landmark_dataset.py" \
            "$RUNNER_TEMP/aris4c005_sb_history.csv" \
            "$RUNNER_TEMP/aris4c005_sb_landmark.csv" \
            "$PAPER_DIR/data/pilot/sb_landmark_pilot_summary.json" \
            --landmark-age 5 \
            --horizon-years 10 \
            --observation-end-year 2025

      - name: Run SB1 early-citation prediction baseline
        run: |
          python "$PAPER_DIR/code/sb1_baseline.py" \
            "$RUNNER_TEMP/aris4c005_sb_landmark.csv" \
            "$RUNNER_TEMP/aris4c005_sb1_predictions.csv" \
            "$PAPER_DIR/data/pilot/sb1_baseline_summary.json" \
            --target outcome_awakening_within_horizon_after_landmark \
            --folds 5

      - name: Validate summary
        run: |
          python - <<'PY'
          import json
          p = 'papers/005-hidden-burden-bad-science/data/pilot/sleeping_beauty_pilot_summary.json'
          d = json.load(open(p, encoding='utf-8'))
          assert d["classification"] == "MATURE_RANDOM_DELAYED_RECOGNITION_PILOT_NOT_LOST_DISCOVERY_COUNT"
          assert d["sampling"]["sample_n_realized"] > 0
          assert d["beauty_coefficient"]["max"] is not None
          q = 'papers/005-hidden-burden-bad-science/data/pilot/sb_landmark_pilot_summary.json'
          l = json.load(open(q, encoding='utf-8'))
          assert l["classification"] == "SB1_LANDMARK_DATASET_NOT_CAUSAL_SUPPRESSION"
          assert l["papers_eligible_for_horizon"] > 0
          r = 'papers/005-hidden-burden-bad-science/data/pilot/sb1_baseline_summary.json'
          b = json.load(open(r, encoding='utf-8'))
          assert b["classification"] == "SB1_EARLY_CITATION_BASELINE_ENGINEERING_NOT_CAUSAL"
          assert b["rows_eligible"] == l["papers_eligible_for_horizon"]
          print(json.dumps({"sb0": d, "sb1": l, "baseline": b}, indent=2))
          PY

      - name: Upload row-level historical pilot
        uses: actions/upload-artifact@v4
        with:
          name: aris4c005-sleeping-beauty-pilot
          path: |
            ${{ runner.temp }}/aris4c005_sb_history.csv
            ${{ runner.temp }}/aris4c005_sb_metrics.csv
            ${{ runner.temp }}/aris4c005_sb_landmark.csv
            ${{ runner.temp }}/aris4c005_sb1_predictions.csv
          retention-days: 30
          if-no-files-found: error

      - name: Persist public-safe aggregate summary
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PAPER_DIR/data/pilot/sleeping_beauty_pilot_summary.json" "$PAPER_DIR/data/pilot/sb_landmark_pilot_summary.json" "$PAPER_DIR/data/pilot/sb1_baseline_summary.json"
          if git diff --cached --quiet; then
            echo "No Sleeping Beauty summary change."
            exit 0
          fi
          git commit -m "Update ARIS4C005 Sleeping Beauty, landmark and baseline summaries [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
