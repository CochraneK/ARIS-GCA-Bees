name: Paper 002 environment freeze

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paper002-env-freeze.yml'

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis stack
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn matplotlib
      - name: Print exact environment
        run: |
          python --version
          python - <<'PY'
          import numpy, pandas, scipy, sklearn, matplotlib
          print("numpy=="+numpy.__version__)
          print("pandas=="+pandas.__version__)
          print("scipy=="+scipy.__version__)
          print("scikit-learn=="+sklearn.__version__)
          print("matplotlib=="+matplotlib.__version__)
          PY
