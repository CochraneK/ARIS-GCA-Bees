name: ARIS4C001 quality gate

on:
  push:
    paths:
      - 'papers/001-gca-bees/**'
      - 'docs/paper/en/main.html'
      - 'docs/paper/zh/main.html'
      - '.github/workflows/aris4c001-ci.yml'
  pull_request:
    paths:
      - 'papers/001-gca-bees/**'
      - 'docs/paper/en/main.html'
      - 'docs/paper/zh/main.html'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - run: python -m py_compile papers/001-gca-bees/code/quality_gate.py papers/001-gca-bees/code/published_summary_analysis.py papers/001-gca-bees/code/model_recovery.py papers/001-gca-bees/code/generate_figures.py
      - run: python papers/001-gca-bees/code/quality_gate.py
      - run: python papers/001-gca-bees/code/published_summary_analysis.py
      - run: git diff --exit-code papers/001-gca-bees/data/published_summary_synthesis.json
      - run: python papers/001-gca-bees/code/generate_figures.py
      - run: test -s papers/001-gca-bees/figures/figure1_published_learning_covariance.svg && test -s papers/001-gca-bees/figures/figure2_factor_loading_congruence.svg && test -s papers/001-gca-bees/figures/figure3_model_recovery.svg
      - run: grep -q 'not a population meta-analysis' papers/001-gca-bees/figures/figure1_published_learning_covariance.svg && grep -q 'Not empirical evidence about bees' papers/001-gca-bees/figures/figure3_model_recovery.svg
      - run: python tools/audit_paper_outputs.py
      - run: python papers/001-gca-bees/code/model_recovery.py --smoke
