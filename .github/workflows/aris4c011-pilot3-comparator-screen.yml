name: ARIS4C011 Pilot 3 comparator notice screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "papers/011-research-forensics/data/results/pilot3_comparator_candidates.json"

permissions:
  contents: write

concurrency:
  group: aris4c011-pilot3-comparator-screen
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: papers/011-research-forensics

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run notice-screen unit tests
        run: python code/test_pilot3_comparator_screen.py -q

      - name: Screen provisional comparators against Crossref and PubMed
        run: |
          python code/pilot3_comparator_screen.py             --input data/results/pilot3_comparator_candidates.json             --output data/results/pilot3_comparator_notice_screen.json

      - name: Audit claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/results/pilot3_comparator_notice_screen.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x["artifact_qualification_required"] is True
          assert x["selected_count"]==4
          assert len(set(x["selected_target_ids"]))==4
          assert all(
              row["development_comparator_role"]
              =="NO_KNOWN_INTEGRITY_CONCERN_COMPARATOR"
              and row["artifact_qualification_required"] is True
              for row in x["selected_development_comparators"]
          )
          print(json.dumps({
              "screen_pass_count":x["screen_pass_count"],
              "selected_count":x["selected_count"],
              "selected_target_ids":x["selected_target_ids"],
              "artifact_qualification_required":True,
          },indent=2))
          PY

      - name: Commit notice-screen results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/pilot3_comparator_notice_screen.json
          if git diff --cached --quiet; then
            echo "Comparator screen already current."
          else
            git commit -m "ARIS4C011 record comparator notice-negative screen"
            pushed=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push; then pushed=1; break; fi
              sleep $((attempt*2))
            done
            test "$pushed" -eq 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aris4c011-pilot3-comparator-notice-screen
          path: papers/011-research-forensics/data/results/pilot3_comparator_notice_screen.json
          retention-days: 30
