name: Build ARIS4C paper index

on:
  push:
    branches: [main]
    paths:
      - 'papers/**/paper.json'
      - 'tools/build_papers_index.py'
      - 'tools/migrate_aris4c.py'
      - '.github/workflows/build-paper-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate stale ARIS4C branding and links
        run: python tools/migrate_aris4c.py
      - name: Build portfolio
        run: python tools/build_papers_index.py
      - name: Commit generated and migrated assets
        run: |
          if git diff --quiet; then
            echo "No generated or migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: apply ARIS4C migration and regenerate index"
          git push
