name: Build ARIS4C paper index

on:
  push:
    branches: [main]
    paths:
      - 'papers/**/paper.json'
      - 'papers/dashboard.json'
      - 'tools/build_papers_index.py'
      - 'tools/build_readme.py'
      - 'tools/build_readme_assets.py'
      - 'tools/audit_paper_outputs.py'
      - 'tools/audit_readme.py'
      - 'tools/audit_portfolio_status.py'
      - 'ARIS4C_STATUS_MODEL.md'
      - 'ARIS4C_OPERATING_MODEL.md'
      - 'tools/portfolio_queue.py'
      - 'tools/sync_000_controller.py'
      - '000/**'
      - 'ARIS4C_OUTPUT_STANDARD.md'
      - 'tools/migrate_aris4c.py'
      - '.github/workflows/build-paper-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aris4c-paper-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate portfolio from latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Generation attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python tools/migrate_aris4c.py
            python tools/audit_paper_outputs.py
            python tools/build_papers_index.py
            python tools/build_readme_assets.py
            python tools/build_readme.py
            python tools/audit_readme.py
            python tools/audit_portfolio_status.py
            python tools/portfolio_queue.py
            python tools/sync_000_controller.py

            if git diff --quiet; then
              echo "No generated or migration changes"
              exit 0
            fi

            git add -A
            git commit -m "docs: apply ARIS4C migration and regenerate index"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent update detected; rebuilding from newest main."
          done

          echo "Failed to publish generated index after 3 attempts." >&2
          exit 1
