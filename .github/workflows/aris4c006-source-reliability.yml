name: ARIS4C006 source split-half reliability pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-source-reliability.yml"
      - "papers/006-chinese-alphabetical-exposure/code/10_source_reliability_pilot.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run split-half source-context reliability pilot
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          python code/10_source_reliability_pilot.py \
            --target-years 2020,2024 \
            --top-sources 2 \
            --per-source 40 \
            --min-window-output 20 \
            --min-half 12 \
            --outdir data/pilot/source_reliability
      - name: Upload aggregate source-reliability artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-source-reliability-pilot
          path: |
            ${{ env.PAPER_DIR }}/data/pilot/source_reliability/source_split_half.csv
            ${{ env.PAPER_DIR }}/data/pilot/source_reliability/manifest.json
          if-no-files-found: error
          retention-days: 30
