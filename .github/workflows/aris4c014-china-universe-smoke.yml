name: ARIS4C014 China Institution Universe Pilot 0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "papers/014-public-integrity-forensics/code/china_universe.py"
      - "papers/014-public-integrity-forensics/code/live_china_universe_smoke.py"
      - "papers/014-public-integrity-forensics/code/test_china_universe.py"
      - ".github/workflows/aris4c014-china-universe-smoke.yml"

permissions:
  contents: read

jobs:
  institution-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verified HTTP client
        run: python -m pip install --disable-pip-version-check requests certifi
      - name: Run official universe smoke
        working-directory: papers/014-public-integrity-forensics/code
        run: python live_china_universe_smoke.py
      - name: Upload universe artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c014-china-institution-universe-pilot0
          path: papers/014-public-integrity-forensics/code/china_universe_pilot0.json
          retention-days: 30
