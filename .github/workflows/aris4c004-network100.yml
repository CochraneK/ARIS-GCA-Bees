name: ARIS4C004 network100 acquisition

concurrency:
  group: aris4c004-network100
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/identity_decisions_100.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  work-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    env:
      PAPER_DIR: papers/004-counterfactual-cost-of-exclusion
      SHARD: ${{ matrix.shard }}
      OUT: papers/004-counterfactual-cost-of-exclusion/data/interim/network100-work-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical identity100 freeze
        run: |
          python "$PAPER_DIR/code/validate_identity.py" \
            "$PAPER_DIR/data/derived/identity_decisions_100.csv" \
            --candidate-frame "$PAPER_DIR/data/derived/science_candidates_frozen.csv"

      - name: Build deterministic VERIFIED-person shard
        shell: bash
        run: |
          mkdir -p "$OUT"
          python - <<'PY'
          import csv, os
          from pathlib import Path

          paper = Path(os.environ["PAPER_DIR"])
          out = Path(os.environ["OUT"])
          shard = int(os.environ["SHARD"])
          n_shards = 8
          src = paper / "data/derived/identity_decisions_100.csv"
          with src.open("r", encoding="utf-8-sig", newline="") as h:
              rows = list(csv.DictReader(h))
              fields = list(rows[0].keys())
          verified = sorted(
              [r for r in rows if r["identity_status"] in {"VERIFIED_SINGLE","VERIFIED_CLUSTER"}],
              key=lambda r: r["person_id"],
          )
          part = verified[shard::n_shards]
          if not part:
              raise SystemExit(f"verified work shard {shard} is empty")
          dst = out / "identity_decisions_shard.csv"
          with dst.open("w", encoding="utf-8", newline="") as h:
              w = csv.DictWriter(h, fieldnames=fields)
              w.writeheader()
              w.writerows(part)
          print({"shard": shard, "verified_total": len(verified), "rows": len(part)})
          PY

      - name: Build full verified-person work corpus shard
        run: |
          python "$PAPER_DIR/code/network/build_verified_work_corpus.py" \
            --decisions "$OUT/identity_decisions_shard.csv" \
            --out-dir "$OUT/verified_work_corpus" \
            --fetch-year-min 1800 \
            --fetch-year-max 2026 \
            --max-works-per-id 500 \
            --min-network-works 5 \
            --sleep-rps 2 \
            --review-all-held

      - name: Upload work shard
        uses: actions/upload-artifact@v4
        with:
          name: aris4c004-network100-work-${{ matrix.shard }}
          path: |
            ${{ env.OUT }}/identity_decisions_shard.csv
            ${{ env.OUT }}/verified_work_corpus/verified_work_corpus.jsonl
            ${{ env.OUT }}/verified_work_corpus/verified_work_summary.csv
            ${{ env.OUT }}/verified_work_corpus/work_review_queue.csv
            ${{ env.OUT }}/verified_work_corpus/verified_work_overall.json
            ${{ env.OUT }}/verified_work_corpus/verified_work_errors.csv
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: work-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_DIR: papers/004-counterfactual-cost-of-exclusion
      OUT: papers/004-counterfactual-cost-of-exclusion/data/interim/network100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all work shards
        uses: actions/download-artifact@v4
        with:
          pattern: aris4c004-network100-work-*
          path: network100-work-shards
          merge-multiple: false

      - name: Merge verified-work shards
        run: |
          mkdir -p "$OUT/verified_work_corpus"
          python "$PAPER_DIR/code/network/merge_verified_work_shards.py" \
            --shard-root network100-work-shards \
            --out-dir "$OUT/verified_work_corpus" \
            --expected-shards 8

      - name: Build deterministic identity second-review sample
        run: |
          python "$PAPER_DIR/code/review/select_identity_second_review.py" \
            "$PAPER_DIR/data/derived/identity_decisions_100.csv" \
            --output "$OUT/identity_second_review_queue.csv" \
            --summary-json "$OUT/identity_second_review_summary.json" \
            --single-fraction 0.25 \
            --seed aris4c004-identity-second-review-v1

      - name: Build deterministic held-work audit sample
        run: |
          python "$PAPER_DIR/code/analysis/build_work_audit_sample.py" \
            --corpus "$OUT/verified_work_corpus/verified_work_corpus.jsonl" \
            --identities "$PAPER_DIR/data/derived/identity_decisions_100.csv" \
            --output-csv "$OUT/held_work_audit_sample.csv" \
            --summary-json "$OUT/held_work_audit_sample_summary.json" \
            --max-per-person 12

      - name: Print P3 acquisition summaries
        run: |
          cat "$OUT/identity_second_review_summary.json"
          cat "$OUT/verified_work_corpus/verified_work_overall.json"
          cat "$OUT/held_work_audit_sample_summary.json"

      - name: Upload network100 acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c004-network100-acquisition
          path: |
            ${{ env.OUT }}/identity_second_review_queue.csv
            ${{ env.OUT }}/identity_second_review_summary.json
            ${{ env.OUT }}/held_work_audit_sample.csv
            ${{ env.OUT }}/held_work_audit_sample_summary.json
            ${{ env.OUT }}/verified_work_corpus/verified_work_corpus.jsonl
            ${{ env.OUT }}/verified_work_corpus/verified_work_summary.csv
            ${{ env.OUT }}/verified_work_corpus/work_review_queue.csv
            ${{ env.OUT }}/verified_work_corpus/verified_work_overall.json
            ${{ env.OUT }}/verified_work_corpus/verified_work_errors.csv
          if-no-files-found: error
          retention-days: 30
