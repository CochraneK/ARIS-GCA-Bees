name: ARIS4C005 Pilot B seed frame

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c005-pilot-b-seed.yml"
      - "papers/005-hidden-burden-bad-science/code/build_pilot_b_seed.py"
      - "papers/005-hidden-burden-bad-science/code/classify_retractions.py"
      - "papers/005-hidden-burden-bad-science/code/tests/test_pilot_b_seed.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aris4c005-pilot-b-seed
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_DIR: papers/005-hidden-burden-bad-science
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and test
        run: |
          python -m compileall -q "$PAPER_DIR/code"
          python -m unittest discover -s "$PAPER_DIR/code/tests" -p 'test_*.py' -v

      - name: Acquire pinned-at-run-time Retraction Watch snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rw"
          git clone --depth 1 https://gitlab.com/crossref/retraction-watch-data.git "$RUNNER_TEMP/rw/repo"
          cd "$RUNNER_TEMP/rw/repo"
          git rev-parse HEAD > "$RUNNER_TEMP/rw/git_commit.txt"
          CSV="$(find . -type f -iname '*.csv' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$CSV"
          cp "$CSV" "$RUNNER_TEMP/rw/retraction_watch.csv"

      - name: Classify Retraction Watch screening signals
        run: |
          python "$PAPER_DIR/code/classify_retractions.py" \
            "$RUNNER_TEMP/rw/retraction_watch.csv" \
            "$RUNNER_TEMP/rw/retraction_watch_classified.csv"

      - name: Build real 2015-2020 Pilot B seed frame
        env:
          OPENALEX_MAILTO: ""
        run: |
          python "$PAPER_DIR/code/build_pilot_b_seed.py" \
            "$RUNNER_TEMP/rw/retraction_watch_classified.csv" \
            "$RUNNER_TEMP/aris4c005_pilot_b_seed.csv" \
            "$PAPER_DIR/data/pilot/pilot_b_seed_summary.json" \
            --start 2015 \
            --end 2020 \
            --corpus core \
            --random-n 600 \
            --seed 20260918

      - name: Append source snapshot provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          paper = Path(os.environ["PAPER_DIR"])
          p = paper / "data/pilot/pilot_b_seed_summary.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          data["retraction_watch_git_commit"] = Path(
              os.environ["RUNNER_TEMP"] + "/rw/git_commit.txt"
          ).read_text().strip()
          data["source_repository"] = "https://gitlab.com/crossref/retraction-watch-data"
          data["row_level_release_policy"] = (
              "Row-level seed frame is an Actions artifact only; canonical repository "
              "stores aggregate provenance/summary, not a public suspicion list."
          )
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate seed summary
        run: |
          python - <<'PY'
          import json
          p = "papers/005-hidden-burden-bad-science/data/pilot/pilot_b_seed_summary.json"
          data = json.load(open(p, encoding="utf-8"))
          assert data["classification"] == "PILOT_B_SEED_SAMPLE_NOT_PREVALENCE_ESTIMATE"
          assert data["openalex_target"]["denominator"] > 0
          assert data["openalex_target"]["random_n_resolved_unique"] > 0
          assert data["sample"]["unique_selected_works"] > 0
          assert data["rw_enrichment"]["resolved_target_universe_dois"] > 0
          print(json.dumps(data, indent=2)[:12000])
          PY

      - name: Upload row-level adjudication seed packet
        uses: actions/upload-artifact@v4
        with:
          name: aris4c005-pilot-b-seed
          path: ${{ runner.temp }}/aris4c005_pilot_b_seed.csv
          retention-days: 30
          if-no-files-found: error

      - name: Persist public-safe aggregate summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+cochranek@users.noreply.github.com"
          git add "$PAPER_DIR/data/pilot/pilot_b_seed_summary.json"
          if git diff --cached --quiet; then
            echo "No summary change."
            exit 0
          fi
          git commit -m "Update ARIS4C005 Pilot B seed summary [skip ci]"
          git push
