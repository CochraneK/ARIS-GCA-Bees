name: Language periodic-system Stage 1C

on:
  push:
    branches:
      - research/language-periodic-system-aris
    paths:
      - 'ideas/language-periodic-system/stage1.py'
      - 'ideas/language-periodic-system/stage1b.py'
      - 'ideas/language-periodic-system/stage1c.py'
      - '.github/workflows/language-periodic-stage1c.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: language-periodic-stage1c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage1c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn
      - name: Run Stage-1C predefined-domain screen
        run: python ideas/language-periodic-system/stage1c.py
      - name: Commit Stage-1C outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideas/language-periodic-system/STAGE1C_REPORT.md ideas/language-periodic-system/stage1c-results.json
          if git diff --cached --quiet; then
            echo "No Stage-1C output changes"
            exit 0
          fi
          git commit -m "research: record language periodic-system Stage-1C domains"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
