name: ARIS4C014 UK lifecycle record smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "papers/014-public-integrity-forensics/code/live_uk_fts_record_smoke.py"
      - "papers/014-public-integrity-forensics/code/source_adapters.py"
      - ".github/workflows/aris4c014-uk-record-smoke.yml"

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch identifier-joinable FTS processes and reconstruct lifecycle
        working-directory: papers/014-public-integrity-forensics/code
        run: python live_uk_fts_record_smoke.py --out uk_fts_record_smoke.json --sample-size 8

      - name: Upload lifecycle coverage output
        uses: actions/upload-artifact@v4
        with:
          name: aris4c014-uk-fts-record-smoke
          path: papers/014-public-integrity-forensics/code/uk_fts_record_smoke.json
          retention-days: 14
