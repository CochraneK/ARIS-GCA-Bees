name: ARIS4C006 confirmatory H1 H2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-confirmatory-h1h2.yml"
      - "papers/006-chinese-alphabetical-exposure/process/TRIGGER_CONFIRMATORY_H1H2"

permissions:
  contents: read
  actions: read

jobs:
  confirmatory-h1h2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
      SOURCE_RUN_ID: "35424125236"
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed preregistration lock and explicit unlock
        working-directory: ${{ env.PAPER_DIR }}
        run: python code/31_verify_prereg_lock.py --require-unlock

      - name: Download frozen convention aggregate
        uses: actions/download-artifact@v4
        with:
          name: aris4c006-final-convention-aggregate-repaired
          path: frozen/convention
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download frozen primary-frame aggregate
        uses: actions/download-artifact@v4
        with:
          name: aris4c006-primary-frame-aggregate-repaired
          path: frozen/frame
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Build exact-LOAO confirmatory frame
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          mkdir -p data/confirmatory/h1h2
          python code/29_build_confirmatory_loao_frame.py \
            --focal-rows "../../../frozen/frame/primary_focal_rows_all_fields.csv" \
            --rolling-exposure "../../../frozen/convention/rolling_exposure_all_fields.csv" \
            --convention-contributions "../../../frozen/convention/convention_work_contributions_all_fields.csv" \
            --out data/confirmatory/h1h2/loao_frame.csv \
            --manifest data/confirmatory/h1h2/loao_frame_manifest.json

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"

      - name: Install frozen analysis dependencies
        run: Rscript -e 'install.packages(c("fixest","jsonlite"), repos="https://cloud.r-project.org")'

      - name: Run preregistered H1 and H2
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          Rscript code/30_confirmatory_h1_h2.R \
            --input data/confirmatory/h1h2/loao_frame.csv \
            --outdir data/confirmatory/h1h2/results

      - name: Upload confirmatory H1/H2 outputs
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-confirmatory-h1h2
          path: |
            ${{ env.PAPER_DIR }}/data/confirmatory/h1h2/loao_frame_manifest.json
            ${{ env.PAPER_DIR }}/data/confirmatory/h1h2/results/confirmatory_h1_h2.csv
            ${{ env.PAPER_DIR }}/data/confirmatory/h1h2/results/manifest.json
          if-no-files-found: error
          retention-days: 90
