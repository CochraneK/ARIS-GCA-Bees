name: ARIS4C006 locked-analysis R syntax

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-analysis-r-syntax.yml"
      - "papers/006-chinese-alphabetical-exposure/code/30_confirmatory_h1_h2.R"
  pull_request:
    paths:
      - "papers/006-chinese-alphabetical-exposure/code/30_confirmatory_h1_h2.R"

permissions:
  contents: read

jobs:
  parse-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Parse locked H1/H2 runner without executing it
        run: |
          Rscript -e 'parse(file="papers/006-chinese-alphabetical-exposure/code/30_confirmatory_h1_h2.R"); cat("R syntax OK\n")'
