name: ARIS4C004 identity100 expansion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c004-identity100.yml"
      - "papers/004-counterfactual-cost-of-exclusion/code/acquire/openalex_pilot.py"
      - "papers/004-counterfactual-cost-of-exclusion/code/resolve/**"
      - "papers/004-counterfactual-cost-of-exclusion/code/validate_identity.py"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/science_candidates_frozen.csv"
      - "papers/004-counterfactual-cost-of-exclusion/data/derived/identity_decisions_pilot30.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity100:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_DIR: papers/004-counterfactual-cost-of-exclusion
      OUT: papers/004-counterfactual-cost-of-exclusion/data/interim/identity100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize frozen 100-person frame
        run: |
          mkdir -p "$OUT/openalex/cluster_evidence" "$OUT/identity_packet"
          cp "$PAPER_DIR/data/derived/science_candidates_frozen.csv" "$OUT/science_candidates_frozen.csv"
          test $(($(wc -l < "$OUT/science_candidates_frozen.csv") - 1)) -eq 100

      - name: Add Wikidata identifier leads
        continue-on-error: true
        run: |
          python "$PAPER_DIR/code/resolve/wikidata_identifiers.py" \
            "$OUT/science_candidates_frozen.csv" \
            --output "$OUT/science_candidates_identifiers.csv"

      - name: Ensure identifier table exists
        run: |
          if [ ! -s "$OUT/science_candidates_identifiers.csv" ]; then
            cp "$OUT/science_candidates_frozen.csv" "$OUT/science_candidates_identifiers.csv"
          fi

      - name: Resolve all 100 candidates against OpenAlex
        run: |
          python "$PAPER_DIR/code/acquire/openalex_pilot.py" \
            "$OUT/science_candidates_identifiers.csv" \
            --out-dir "$OUT/openalex" \
            --year-min 1800 \
            --year-max 2026 \
            --max-candidates 100 \
            --max-works-per-author 50 \
            --search-n 10 \
            --sleep-rps 2

      - name: Build 100-person fragment review queue
        run: |
          python "$PAPER_DIR/code/resolve/openalex_cluster_review.py" \
            "$OUT/openalex/openalex_resolution_audit.jsonl" \
            --output-csv "$OUT/openalex/identity_review_queue.csv" \
            --summary-json "$OUT/openalex/identity_review_summary.json"

      - name: Collect bounded fragment evidence
        continue-on-error: true
        run: |
          python "$PAPER_DIR/code/resolve/openalex_cluster_evidence.py" \
            "$OUT/openalex/identity_review_queue.csv" \
            --out-dir "$OUT/openalex/cluster_evidence" \
            --year-min 1800 \
            --year-max 2026 \
            --max-works-per-id 100 \
            --sleep-rps 2

      - name: Guard fragment evidence
        run: |
          PAIRS="$OUT/openalex/cluster_evidence/cluster_pairwise_evidence.jsonl"
          if [ -s "$PAIRS" ]; then
            python "$PAPER_DIR/code/resolve/cluster_evidence_guard.py" \
              "$PAIRS" \
              --output-jsonl "$OUT/openalex/cluster_evidence/cluster_pairwise_evidence_guarded.jsonl" \
              --summary-json "$OUT/openalex/cluster_evidence/cluster_guard_summary.json"
          else
            : > "$OUT/openalex/cluster_evidence/cluster_pairwise_evidence_guarded.jsonl"
          fi

      - name: Build accepted top-record profiles
        run: |
          python "$PAPER_DIR/code/resolve/build_single_author_profiles.py" \
            --candidates "$OUT/science_candidates_frozen.csv" \
            --authors "$OUT/openalex/openalex_authors.jsonl" \
            --works "$OUT/openalex/openalex_works.jsonl" \
            --output-jsonl "$OUT/identity_packet/accepted_author_profiles.jsonl"

      - name: Fetch MH-blind authority evidence for all 100
        run: |
          python "$PAPER_DIR/code/resolve/wikidata_identity_evidence.py" \
            "$OUT/science_candidates_frozen.csv" \
            --output-jsonl "$OUT/identity_packet/wikidata_identity_evidence.jsonl" \
            --summary-json "$OUT/identity_packet/wikidata_identity_summary.json" \
            --max-candidates 100

      - name: Assemble all profile evidence
        run: |
          : > "$OUT/identity_packet/all_author_profiles.jsonl"
          cat "$OUT/identity_packet/accepted_author_profiles.jsonl" >> "$OUT/identity_packet/all_author_profiles.jsonl"
          if [ -s "$OUT/openalex/cluster_evidence/cluster_author_profiles.jsonl" ]; then
            cat "$OUT/openalex/cluster_evidence/cluster_author_profiles.jsonl" >> "$OUT/identity_packet/all_author_profiles.jsonl"
          fi

      - name: Build 100-person review packet
        run: |
          python "$PAPER_DIR/code/resolve/build_identity_review_packet.py" \
            --candidates "$OUT/science_candidates_frozen.csv" \
            --queue "$OUT/openalex/identity_review_queue.csv" \
            --profiles "$OUT/identity_packet/all_author_profiles.jsonl" \
            --guarded-pairs "$OUT/openalex/cluster_evidence/cluster_pairwise_evidence_guarded.jsonl" \
            --authority "$OUT/identity_packet/wikidata_identity_evidence.jsonl" \
            --output-jsonl "$OUT/identity_packet/identity_review_packet.jsonl" \
            --output-md "$OUT/identity_packet/IDENTITY_REVIEW_PACKET.md" \
            --summary-json "$OUT/identity_packet/identity_review_packet_summary.json" \
            --max-candidates 100

      - name: Create canonical 100-person decision draft
        run: |
          python "$PAPER_DIR/code/resolve/build_identity100_draft.py" \
            --candidates "$OUT/science_candidates_frozen.csv" \
            --queue "$OUT/openalex/identity_review_queue.csv" \
            --existing-decisions "$PAPER_DIR/data/derived/identity_decisions_pilot30.csv" \
            --output "$OUT/identity_decisions_100_draft.csv" \
            --summary-json "$OUT/identity_decisions_100_summary.json"

      - name: Validate 100-person decision draft against frozen frame
        run: |
          python "$PAPER_DIR/code/validate_identity.py" \
            "$OUT/identity_decisions_100_draft.csv" \
            --candidate-frame "$OUT/science_candidates_frozen.csv"

      - name: Print identity100 summaries
        run: |
          cat "$OUT/openalex/identity_review_summary.json"
          cat "$OUT/identity_decisions_100_summary.json"
          cat "$OUT/identity_packet/wikidata_identity_summary.json"

      - name: Upload identity100 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c004-identity100
          path: |
            ${{ env.OUT }}/identity_decisions_100_draft.csv
            ${{ env.OUT }}/identity_decisions_100_summary.json
            ${{ env.OUT }}/science_candidates_identifiers.csv
            ${{ env.OUT }}/openalex/openalex_acquisition_summary.json
            ${{ env.OUT }}/openalex/openalex_resolution_audit.jsonl
            ${{ env.OUT }}/openalex/identity_review_queue.csv
            ${{ env.OUT }}/openalex/identity_review_summary.json
            ${{ env.OUT }}/openalex/cluster_evidence/cluster_guard_summary.json
            ${{ env.OUT }}/identity_packet/wikidata_identity_evidence.jsonl
            ${{ env.OUT }}/identity_packet/wikidata_identity_summary.json
            ${{ env.OUT }}/identity_packet/identity_review_packet.jsonl
            ${{ env.OUT }}/identity_packet/IDENTITY_REVIEW_PACKET.md
            ${{ env.OUT }}/identity_packet/identity_review_packet_summary.json
          if-no-files-found: warn
          retention-days: 30
