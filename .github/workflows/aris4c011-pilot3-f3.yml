name: ARIS4C011 Pilot 3 F3 Content-Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "papers/011-research-forensics/data/results/pilot3_toxo_table1_trackA_object.json"
      - "papers/011-research-forensics/code/pilot3_f3_table_schema.py"
      - ".github/workflows/aris4c011-pilot3-f3.yml"

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPER_DIR: papers/011-research-forensics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run content-only F3 detector
        run: |
          python "$PAPER_DIR/code/pilot3_f3_table_schema.py" \
            --input "$PAPER_DIR/data/results/pilot3_toxo_table1_trackA_object.json" \
            --output "$PAPER_DIR/data/results/pilot3_toxo_f3_detection.json"
      - name: Manager-only evaluate against frozen correction label
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("papers/011-research-forensics/data/results")
          d=json.loads((root/"pilot3_toxo_f3_detection.json").read_text())
          q=json.loads((root/"pilot3_toxo_table1_qualification.json").read_text())
          assert d["outcome_metadata_used"] is False
          assert d["correction_metadata_used"] is False
          label=bool(q["correction_confirms_two_missing_columns"])
          flagged=d["finding"]=="FLAG"
          evaluation={
            "paper_id":d["paper_id"],
            "detector_id":d["detector_id"],
            "detector_output":d["finding"],
            "frozen_manager_label":"DOCUMENTED_TABLE_COLUMN_OMISSION" if label else "LABEL_NOT_CONFIRMED",
            "true_positive":bool(flagged and label),
            "false_negative":bool((not flagged) and label),
            "label_visible_to_detector":False,
            "misconduct_inference":False,
            "note":"Detector output was produced from the SAFE_EXACT original table schema before manager label comparison."
          }
          (root/"pilot3_toxo_f3_evaluation.json").write_text(json.dumps(evaluation,indent=2)+"\n")
          print(json.dumps(evaluation,indent=2))
          PY
      - name: Persist F3 result
        run: |
          git config user.name "ARIS4C Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "$PAPER_DIR/data/results/pilot3_toxo_f3_detection.json" \
            "$PAPER_DIR/data/results/pilot3_toxo_f3_evaluation.json"
          if ! git diff --cached --quiet; then
            git commit -m "011: add pre-outcome F3 table-schema evaluation"
            git pull --rebase origin main
            git push
          fi
