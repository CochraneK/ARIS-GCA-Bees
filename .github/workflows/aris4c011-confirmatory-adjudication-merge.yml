name: ARIS4C011 merge manager first-pass adjudication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c011-confirmatory-adjudication-merge.yml"
      - "papers/011-research-forensics/code/apply_confirmatory_adjudication.py"
      - "papers/011-research-forensics/code/test_apply_confirmatory_adjudication.py"
      - "papers/011-research-forensics/data/protocol/adjudication_batches/*.json"
      - "papers/011-research-forensics/data/protocol/confirmatory_adjudication_packet_v0.csv"
      - "papers/011-research-forensics/data/protocol/confirmatory_adjudication_protocol_v0.json"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papers/011-research-forensics
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python code/test_apply_confirmatory_adjudication.py -q
      - name: Merge all first-pass patches
        run: |
          patches=()
          for f in data/protocol/adjudication_batches/*.json; do
            [ -e "$f" ] && patches+=(--patch "$f")
          done
          python code/apply_confirmatory_adjudication.py \
            --packet data/protocol/confirmatory_adjudication_packet_v0.csv \
            "${patches[@]}" \
            --output data/protocol/confirmatory_adjudication_firstpass_v0.csv \
            --audit-output data/results/confirmatory_adjudication_merge_v0.json
      - name: Validate merged first pass
        run: |
          python code/validate_confirmatory_adjudication.py \
            --packet data/protocol/confirmatory_adjudication_firstpass_v0.csv \
            --protocol data/protocol/confirmatory_adjudication_protocol_v0.json \
            --output data/results/confirmatory_adjudication_validation_v0.json
      - name: Commit first-pass aggregate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/protocol/confirmatory_adjudication_firstpass_v0.csv
          git add data/results/confirmatory_adjudication_merge_v0.json
          git add data/results/confirmatory_adjudication_validation_v0.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ARIS4C011 merge manager first-pass adjudication"
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
