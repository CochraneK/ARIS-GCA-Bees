name: ARIS4C007 Pilot 2 observed events

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/007-pilot2-events.yml"
      - "papers/007-cross-species-age-equivalence/code/build_pilot2_events.py"
      - "papers/007-cross-species-age-equivalence/code/summarize_pilot2_cluster.py"
      - "papers/007-cross-species-age-equivalence/code/build_pilot1_demography.py"
      - "papers/007-cross-species-age-equivalence/code/age_mappings.py"
      - "papers/007-cross-species-age-equivalence/data/sources/translating_time_2026/TableS1__Sheet1.csv"
      - "papers/007-cross-species-age-equivalence/data/sources/translating_time_2026/provenance.json"

permissions:
  contents: read
  actions: read

jobs:
  observed-events:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve canonical successful Pilot 0 artifact
        working-directory: papers/007-cross-species-age-equivalence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/upstream/pilot0

          RUNS_JSON="$(gh run list             --workflow 007-pilot0.yml             --status success             --limit 1             --json databaseId,headSha,createdAt,url,conclusion)"
          PILOT0_RUN_ID="$(printf '%s' "$RUNS_JSON" | jq -r '.[0].databaseId // empty')"
          if [ -z "$PILOT0_RUN_ID" ]; then
            echo "No successful ARIS4C007 Pilot 0 run available." >&2
            exit 1
          fi

          gh run view "$PILOT0_RUN_ID"             --json databaseId,headSha,createdAt,url,conclusion,workflowName             > data/upstream/pilot0_run.json
          gh run download "$PILOT0_RUN_ID"             --name aris4c007-pilot0             --dir data/upstream/pilot0

          test -s data/upstream/pilot0/pilot0/coverage_summary.json
          test -s data/upstream/pilot0/pilot0/life_history_mapping_grid.csv

      - name: Validate vendored Januel Table S1
        working-directory: papers/007-cross-species-age-equivalence
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          prov = json.loads(
              Path("data/sources/translating_time_2026/provenance.json")
              .read_text(encoding="utf-8")
          )
          path = Path("data/sources/translating_time_2026/TableS1__Sheet1.csv")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = (
              prov["supplementary_targets"]["TableS1"]
              ["derived_text_files"][0]["sha256"]
          )
          if digest != expected:
              raise SystemExit(f"Table S1 hash mismatch: {digest} != {expected}")
          print("Table S1 OK", digest)
          PY

      - name: Build observed-only held-out event benchmark
        working-directory: papers/007-cross-species-age-equivalence
        run: |
          python code/build_pilot2_events.py             --table-s1 data/sources/translating_time_2026/TableS1__Sheet1.csv             --pilot0-grid data/upstream/pilot0/pilot0/life_history_mapping_grid.csv             --pilot0-coverage data/upstream/pilot0/pilot0/coverage_summary.json             --out data/pilot2_events
          cp data/upstream/pilot0_run.json             data/pilot2_events/upstream_pilot0_run.json
          cp data/sources/translating_time_2026/provenance.json             data/pilot2_events/translating_time_2026.provenance.json
          cat data/pilot2_events/observed_event_summary.json
          cat data/pilot2_events/cluster_robust_summary.json

      - name: Upload Pilot 2 event artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c007-pilot2-observed-events
          path: |
            papers/007-cross-species-age-equivalence/data/pilot2_events/observed_event_summary.json
            papers/007-cross-species-age-equivalence/data/pilot2_events/observed_event_predictions.csv
            papers/007-cross-species-age-equivalence/data/pilot2_events/cluster_robust_summary.json
            papers/007-cross-species-age-equivalence/data/pilot2_events/upstream_pilot0_run.json
            papers/007-cross-species-age-equivalence/data/pilot2_events/translating_time_2026.provenance.json
          if-no-files-found: error
          retention-days: 30
