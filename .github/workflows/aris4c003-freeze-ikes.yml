name: ARIS4C003 freeze IKES and unlock outcomes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aris4c003-freeze-ikes.yml"
      - "papers/003-colonial-disciplinary-advantage/process/ikes_adjudication/ADJUDICATION_DECISIONS.csv"
      - "papers/003-colonial-disciplinary-advantage/process/ikes_adjudication/ADJUDICATION_MEMO.md"

permissions:
  contents: write

jobs:
  freeze-ikes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: papers/003-colonial-disciplinary-advantage

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: papers/003-colonial-disciplinary-advantage/code/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r code/requirements.txt

      - name: Validate design and Coder B preconditions
        run: |
          python code/validate_coder_b_blind_bundle.py
          python code/preoutcome_gate.py --require-design-locked

      - name: Merge only frozen flagged adjudication decisions
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          base = Path("process/ikes_adjudication/IKES_DISAGREEMENTS.csv")
          decisions = Path("process/ikes_adjudication/ADJUDICATION_DECISIONS.csv")
          out = Path("process/ikes_adjudication/IKES_DISAGREEMENTS_ADJUDICATED.csv")

          df = pd.read_csv(base)
          dec = pd.read_csv(decisions)
          keys = ["concept_id", "dimension"]

          if dec.duplicated(keys).any():
              raise SystemExit("Duplicate adjudication decisions")

          flagged = df[df["needs_adjudication"].astype(bool)].copy()
          expected = set(map(tuple, flagged[keys].astype(str).to_numpy()))
          observed = set(map(tuple, dec[keys].astype(str).to_numpy()))
          if observed != expected:
              raise SystemExit(
                  f"Adjudication decision set differs from frozen flagged set. "
                  f"missing={sorted(expected-observed)} extra={sorted(observed-expected)}"
              )

          if not dec["adjudicated_score"].between(0,3).all():
              raise SystemExit("Adjudicated scores must be 0-3")
          if dec["adjudication_note"].fillna("").str.strip().eq("").any():
              raise SystemExit("Every adjudication decision requires a note")

          merged = df.merge(
              dec,
              on=keys,
              how="left",
              suffixes=("", "_decision"),
              validate="many_to_one",
          )
          is_flagged = merged["needs_adjudication"].astype(bool)
          merged.loc[is_flagged, "adjudicated_score"] = merged.loc[
              is_flagged, "adjudicated_score_decision"
          ]
          merged.loc[is_flagged, "adjudication_note"] = merged.loc[
              is_flagged, "adjudication_note_decision"
          ]
          merged = merged.drop(
              columns=["adjudicated_score_decision", "adjudication_note_decision"]
          )

          if merged.loc[is_flagged, "adjudicated_score"].isna().any():
              raise SystemExit("At least one flagged cell remains unresolved")
          if merged.loc[~is_flagged, "adjudicated_score"].notna().any():
              raise SystemExit("Unflagged cell was manually overridden")

          merged.to_csv(out, index=False)
          print(f"adjudicated flagged cells={int(is_flagged.sum())}")
          print(out)
          PY

      - name: Freeze final IKES with full provenance
        run: |
          python code/freeze_ikes.py \
            process/ikes_adjudication/IKES_DISAGREEMENTS_ADJUDICATED.csv \
            --output process/IKES_FROZEN.csv \
            --provenance process/IKES_FROZEN.provenance.json \
            --coder-a process/IKES_CODER_A.csv \
            --coder-b process/IKES_CODER_B.csv \
            --coder-b-notes process/IKES_CODER_B.md \
            --coder-b-raw process/gptpage/2026-09-19_ikes-coder-b-qoder-raw.md

      - name: Require true outcome unlock
        run: |
          python code/preoutcome_gate.py --strict > process/PREOUTCOME_GATE_UNLOCKED.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("process/PREOUTCOME_GATE_UNLOCKED.json")
          obj=json.loads(p.read_text())
          assert obj["design_status"] == "DESIGN_LOCKED"
          assert obj["outcome_status"] == "OUTCOME_UNLOCKED"
          assert not obj["design_problems"]
          assert not obj["outcome_problems"]
          print(json.dumps(obj, indent=2))
          PY

      - name: Commit frozen IKES and unlock audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add process/ikes_adjudication/IKES_DISAGREEMENTS_ADJUDICATED.csv
          git add process/IKES_FROZEN.csv
          git add process/IKES_FROZEN.provenance.json
          git add process/PREOUTCOME_GATE_UNLOCKED.json
          if git diff --cached --quiet; then
            echo "Frozen IKES already current."
          else
            git commit -m "ARIS4C003 freeze adjudicated IKES and unlock outcomes"
            pushed=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push; then
                pushed=1
                break
              fi
              sleep $((attempt * 2))
            done
            test "$pushed" -eq 1
          fi
