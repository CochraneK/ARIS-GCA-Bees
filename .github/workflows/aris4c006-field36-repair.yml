name: ARIS4C006 field36 repair build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-field36-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convention-field36:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build outcome-blind field 36 convention using frozen rules
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          python code/22_materialize_field_convention.py \
            --field-id 36 \
            --start-year 2008 \
            --end-year 2024 \
            --annual-D 35 \
            --annual-D3 20 \
            --max-blocks 4 \
            --outdir data/field36_repair/convention
      - name: Upload field 36 convention artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-field36-repair-convention
          path: ${{ env.PAPER_DIR }}/data/field36_repair/convention/
          if-no-files-found: error
          retention-days: 30

  primary-frame-field36:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download frozen surname inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PAPER_DIR/data/raw"
          curl -L --fail --retry 5 --retry-delay 2 \
            "https://raw.githubusercontent.com/robertostling/chinese-names/main/src/chinese_names/data/familyname.csv" \
            -o "$PAPER_DIR/data/raw/familyname.csv"
          curl -L --fail --retry 5 --retry-delay 2 \
            "https://raw.githubusercontent.com/jaaack-wang/ccnc/a14520b9cc8bd6b251aeb4a7453ab1a45f23aa15/Ch-Last-Names-Dict/ChineseLastNamesNoTones.json" \
            -o "$PAPER_DIR/data/raw/ccnc_lastnames.json"
      - name: Materialize outcome-locked field 36 primary frame using frozen rules
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          python code/24_materialize_primary_frame.py \
            --field-id 36 \
            --familyname-csv data/raw/familyname.csv \
            --ccnc-json data/raw/ccnc_lastnames.json \
            --target-works 40 \
            --min-cell-works 20 \
            --max-blocks 5 \
            --outdir data/field36_repair/primary_frame
      - name: Remove raw surname inputs
        if: always()
        working-directory: ${{ env.PAPER_DIR }}
        run: rm -rf data/raw
      - name: Upload field 36 frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-field36-repair-primary-frame
          path: ${{ env.PAPER_DIR }}/data/field36_repair/primary_frame/
          if-no-files-found: error
          retention-days: 30
