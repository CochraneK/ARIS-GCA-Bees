name: ARIS4C006 author ID canonicalization pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-identity-canonical.yml"
      - "papers/006-chinese-alphabetical-exposure/code/09_identity_canonicalization_pilot.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonicalize-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile embedded author IDs with ORCID canonical authors
        working-directory: ${{ env.PAPER_DIR }}
        run: |
          python code/09_identity_canonicalization_pilot.py \
            --years 2020,2024 \
            --per-cell 25 \
            --outdir data/pilot/identity_canonical
      - name: Upload aggregate canonicalization artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-identity-canonicalization-pilot
          path: |
            ${{ env.PAPER_DIR }}/data/pilot/identity_canonical/identity_canonicalization_by_band.csv
            ${{ env.PAPER_DIR }}/data/pilot/identity_canonical/manifest.json
          if-no-files-found: error
          retention-days: 30
