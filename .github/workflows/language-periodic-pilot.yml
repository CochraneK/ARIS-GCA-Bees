name: Language periodic-system pilot

on:
  push:
    branches: [main]
    paths:
      - 'ideas/language-periodic-system/pilot.py'
      - 'ideas/language-periodic-system/idea.json'
      - '.github/workflows/language-periodic-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Run Stage-0 pilot
        run: python ideas/language-periodic-system/pilot.py
      - name: Commit pilot outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideas/language-periodic-system/PILOT_REPORT.md ideas/language-periodic-system/pilot-results.json
          if git diff --cached --quiet; then
            echo "No pilot output changes"
            exit 0
          fi
          git commit -m "research: record language periodic-system Stage-0 pilot"
          git push
