name: ARIS4C013 Wikidata Pilot 0A

on:
  push:
    branches: [main]
    paths:
      - 'papers/013-birth-death-temporal-coupling/code/pilot0a_wikidata.py'
      - '.github/workflows/aris4c013-wikidata-pilot0a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Download Wikidata-derived snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aris4c013
          url="https://media.githubusercontent.com/media/dalager/wikidata-incarnations/main/born_and_died_slim.csv.gz"
          curl --retry 4 --retry-all-errors --connect-timeout 30 -fL "$url" -o /tmp/aris4c013/born_and_died_slim.csv.gz
          gzip -t /tmp/aris4c013/born_and_died_slim.csv.gz
          ls -lh /tmp/aris4c013/born_and_died_slim.csv.gz
          echo "First two decompressed lines:"
          gzip -cd /tmp/aris4c013/born_and_died_slim.csv.gz | head -n 2 || true

      - name: Run Pilot 0A
        run: |
          python papers/013-birth-death-temporal-coupling/code/pilot0a_wikidata.py             --input /tmp/aris4c013/born_and_died_slim.csv.gz             --json-out /tmp/aris4c013/pilot0a.json             --md-out /tmp/aris4c013/PILOT0A_WIKIDATA.md

      - name: Show report
        run: cat /tmp/aris4c013/PILOT0A_WIKIDATA.md

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: aris4c013-wikidata-pilot0a
          path: |
            /tmp/aris4c013/pilot0a.json
            /tmp/aris4c013/PILOT0A_WIKIDATA.md
          retention-days: 30
