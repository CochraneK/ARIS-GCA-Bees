name: ARIS4C014 Companies House URI smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "papers/014-public-integrity-forensics/code/companies_house_uri.py"
      - "papers/014-public-integrity-forensics/code/live_companies_house_uri_smoke.py"
      - ".github/workflows/aris4c014-companies-house-uri-smoke.yml"

permissions:
  contents: read

jobs:
  uri:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query official no-key Companies House URI service
        working-directory: papers/014-public-integrity-forensics/code
        run: python live_companies_house_uri_smoke.py
