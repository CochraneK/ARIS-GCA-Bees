name: ARIS4C014 live public-source smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "papers/014-public-integrity-forensics/code/live_usaspending_smoke.py"
      - "papers/014-public-integrity-forensics/code/source_adapters.py"
      - ".github/workflows/aris4c014-live-source-smoke.yml"

permissions:
  contents: read

jobs:
  usaspending:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and normalize a public USAspending sample
        working-directory: papers/014-public-integrity-forensics/code
        run: python live_usaspending_smoke.py --out usaspending_smoke.json

      - name: Upload reproducible smoke output
        uses: actions/upload-artifact@v4
        with:
          name: aris4c014-usaspending-smoke
          path: papers/014-public-integrity-forensics/code/usaspending_smoke.json
          retention-days: 14
