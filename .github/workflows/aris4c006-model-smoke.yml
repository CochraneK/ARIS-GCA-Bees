name: ARIS4C006 synthetic model smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aris4c006-model-smoke.yml"
      - "papers/006-chinese-alphabetical-exposure/code/20_synthetic_fixest_smoke.R"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPER_DIR: papers/006-chinese-alphabetical-exposure
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
      - name: Install fixest
        run: Rscript -e 'install.packages("fixest", repos="https://cloud.r-project.org")'
      - name: Run synthetic work-FE + three-way-cluster smoke test
        working-directory: ${{ env.PAPER_DIR }}
        run: Rscript code/20_synthetic_fixest_smoke.R
      - name: Upload smoke-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris4c006-model-smoke
          path: ${{ env.PAPER_DIR }}/data/pilot/model_smoke/manifest.json
          if-no-files-found: error
          retention-days: 30
