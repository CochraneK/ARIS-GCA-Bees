name: ARIS4C007 acquire Translating Time 2026

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/007-pilot2-translating-time.yml"
      - "papers/007-cross-species-age-equivalence/code/acquire_translating_time_2026.py"

permissions:
  contents: write

concurrency:
  group: aris4c007-translating-time-source
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned workbook reader
        run: python -m pip install "openpyxl==3.1.5"

      - name: Acquire and convert official supplementary sources
        run: |
          rm -rf /tmp/tt2026
          python papers/007-cross-species-age-equivalence/code/acquire_translating_time_2026.py             --out /tmp/tt2026

      - name: Publish canonical text snapshot safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            TARGET="papers/007-cross-species-age-equivalence/data/sources/translating_time_2026"
            rm -rf "$TARGET"
            mkdir -p "$(dirname "$TARGET")"
            cp -R /tmp/tt2026 "$TARGET"

            git add "$TARGET"
            if git diff --cached --quiet; then
              echo "Translating Time source snapshot already current."
              exit 0
            fi

            git commit -m "data: vendor Translating Time 2026 source snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Failed to publish Translating Time snapshot." >&2
          exit 1
