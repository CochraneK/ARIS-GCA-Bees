name: Language periodic-system Stage 1

on:
  push:
    branches:
      - research/language-periodic-system-aris
    paths:
      - 'ideas/language-periodic-system/stage1.py'
      - 'ideas/language-periodic-system/refine-logs/EXPERIMENT_PLAN.md'
      - '.github/workflows/language-periodic-stage1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: language-periodic-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn
      - name: Run Stage-1 model competition
        run: python ideas/language-periodic-system/stage1.py
      - name: Commit Stage-1 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideas/language-periodic-system/STAGE1_REPORT.md ideas/language-periodic-system/stage1-results.json
          if git diff --cached --quiet; then
            echo "No Stage-1 output changes"
            exit 0
          fi
          git commit -m "research: record language periodic-system Stage-1 results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
