<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<style>
text{font-family:Inter,Arial,sans-serif;fill:#171717}
.title{font-size:34px;font-weight:700}.h{font-size:23px;font-weight:650}.body{font-size:18px}.small{font-size:15px;fill:#666}
.box{fill:#fff;stroke:#222;stroke-width:2}.soft{fill:#f5f4f1;stroke:#777;stroke-width:1.5}
.arrow{stroke:#333;stroke-width:2.2;fill:none;marker-end:url(#arr)}.dash{stroke:#777;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arr)}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs>
<title>Unrestricted versus semantically admissible concept identification</title>
<text class="title" x="50" y="55">From unrestricted Twenty Questions to semantic identification</text>
<rect class="soft" x="50" y="100" rx="20" width="500" height="440"/>
<rect class="soft" x="650" y="100" rx="20" width="500" height="440"/>
<text class="h" x="80" y="145">Unrestricted information search</text>
<text class="h" x="680" y="145">Semantically admissible search</text>
<text class="body" x="80" y="190">Any candidate partition is allowed.</text>
<rect class="box" x="100" y="225" rx="12" width="400" height="64"/>
<text class="body" x="125" y="264">“Is the target in {2, 4, 7, 8, 11, …}?”</text>
<path class="arrow" d="M300 300 L210 370"/><path class="arrow" d="M300 300 L390 370"/>
<rect class="box" x="100" y="370" rx="12" width="220" height="66"/>
<rect class="box" x="340" y="370" rx="12" width="160" height="66"/>
<text class="body" x="125" y="410">YES subset</text><text class="body" x="375" y="410">NO subset</text>
<text class="small" x="100" y="485">Finite closed-world lower bound: ≈ log₂ N binary answers</text>

<text class="body" x="680" y="190">Questions must have usable semantic meaning.</text>
<rect class="box" x="700" y="220" rx="12" width="400" height="58"/>
<text class="body" x="725" y="256">“Does this sense denote a physical object?”</text>
<rect class="box" x="700" y="295" rx="12" width="400" height="58"/>
<text class="body" x="725" y="331">“Is location essential to its interpretation?”</text>
<rect class="box" x="700" y="370" rx="12" width="400" height="58"/>
<text class="body" x="725" y="406">“Is the case genuinely borderline?”</text>
<text class="small" x="700" y="465">Constraints: type • context • oracle access • vagueness • logic</text>
<text class="small" x="700" y="493">Some target pairs may collide under the admissible query family.</text>

<rect class="box" x="280" y="580" rx="16" width="640" height="75"/>
<text class="h" x="330" y="615">Semantic Query Overhead</text>
<text class="body" x="330" y="643">Δsem = optimal semantic cost − unrestricted optimal cost</text>
</svg>