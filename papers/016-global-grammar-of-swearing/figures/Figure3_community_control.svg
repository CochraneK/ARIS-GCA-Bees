<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#52606d}
.lab{font-size:15px}.val{font-size:12px;font-weight:700}.tick{font-size:13px;fill:#607080}.grid{stroke:#e0e6eb;stroke-width:1}.track{stroke:#cfd8df;stroke-width:2}
.taboo{fill:#4c78a8}.filler{fill:#9c755f}
</style>
<text x="60" y="52" class="title">Figure 3 · Community effects are not yet demonstrably taboo-specific</text>
<text x="60" y="80" class="sub">Item-fixed-effects partial R² across five English community samples; shared taboo items vs sparse shared fillers.</text>
<line x1="300" y1="120" x2="300" y2="590" class="grid"/><text x="300" y="625" text-anchor="middle" class="tick">0.0</text><line x1="500" y1="120" x2="500" y2="590" class="grid"/><text x="500" y="625" text-anchor="middle" class="tick">0.1</text><line x1="700" y1="120" x2="700" y2="590" class="grid"/><text x="700" y="625" text-anchor="middle" class="tick">0.2</text><line x1="900" y1="120" x2="900" y2="590" class="grid"/><text x="900" y="625" text-anchor="middle" class="tick">0.3</text><text x="270" y="165" text-anchor="end" class="lab">Tabooness</text>
 <line x1="300" y1="160" x2="900" y2="160" class="track"/>
 <circle cx="353" cy="150" r="9" class="taboo"/><text x="369" y="155" class="val">0.026</text>
 <rect x="885" y="166" width="16" height="16" class="filler"/><text x="909" y="180" class="val">0.296</text>
<text x="270" y="245" text-anchor="end" class="lab">Offensiveness</text>
 <line x1="300" y1="240" x2="900" y2="240" class="track"/>
 <circle cx="372.2" cy="230" r="9" class="taboo"/><text x="388.2" y="235" class="val">0.036</text>
 <rect x="608.5999999999999" y="246" width="16" height="16" class="filler"/><text x="632.5999999999999" y="260" class="val">0.158</text>
<text x="270" y="325" text-anchor="end" class="lab">Valence</text>
 <line x1="300" y1="320" x2="900" y2="320" class="track"/>
 <circle cx="389.2" cy="310" r="9" class="taboo"/><text x="405.2" y="315" class="val">0.045</text>
 <rect x="696.2" y="326" width="16" height="16" class="filler"/><text x="720.2" y="340" class="val">0.202</text>
<text x="270" y="405" text-anchor="end" class="lab">Arousal</text>
 <line x1="300" y1="400" x2="900" y2="400" class="track"/>
 <circle cx="465.4" cy="390" r="9" class="taboo"/><text x="481.4" y="395" class="val">0.083</text>
 <rect x="772.8" y="406" width="16" height="16" class="filler"/><text x="796.8" y="420" class="val">0.240</text>
<text x="270" y="485" text-anchor="end" class="lab">Concreteness</text>
 <line x1="300" y1="480" x2="900" y2="480" class="track"/>
 <circle cx="722.4" cy="470" r="9" class="taboo"/><text x="738.4" y="475" class="val">0.211</text>
 <rect x="717.8" y="486" width="16" height="16" class="filler"/><text x="741.8" y="500" class="val">0.213</text>
<text x="270" y="565" text-anchor="end" class="lab">AoA</text>
 <line x1="300" y1="560" x2="900" y2="560" class="track"/>
 <circle cx="474.8" cy="550" r="9" class="taboo"/><text x="490.8" y="555" class="val">0.087</text>
 <rect x="678.6" y="566" width="16" height="16" class="filler"/><text x="702.6" y="580" class="val">0.193</text>

<circle cx="300" cy="668" r="8" class="taboo"/><text x="318" y="673" class="sub">Taboo words · 139 shared items / 417 observations</text>
<rect x="610" y="660" width="16" height="16" class="filler"/><text x="636" y="673" class="sub">Fillers · 35 shared items / 73 observations</text>
<text x="60" y="705" class="sub">Filler estimates have wide bootstrap intervals; this figure is a negative-control warning, not evidence that fillers vary intrinsically more.</text>
</svg>