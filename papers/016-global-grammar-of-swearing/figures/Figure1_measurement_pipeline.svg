<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#52606d}.boxTitle{font-size:19px;font-weight:700}.boxText{font-size:14px;fill:#44515d}
.box{fill:#f7f9fb;stroke:#9aa8b5;stroke-width:2;rx:18}.gate{fill:#eef5ff;stroke:#4c78a8;stroke-width:2;rx:18}
.arrow{stroke:#687886;stroke-width:3;fill:none;marker-end:url(#a)}
.note{font-size:14px;font-weight:700;fill:#4c78a8}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#687886"/></marker></defs>
<text x="70" y="58" class="title">ARIS4C016 · Measurement-first path to a Global Swearing Atlas</text>
<text x="70" y="88" class="sub">Observed cross-community differences are not interpreted until annotation, lexical identity, and genealogy are separated.</text>

<rect x="70" y="160" width="220" height="180" class="box"/>
<text x="92" y="198" class="boxTitle">1 · Raw multi-lab data</text>
<text x="92" y="232" class="boxText">18 community samples</text>
<text x="92" y="255" class="boxText">13 languages · 17 countries</text>
<text x="92" y="278" class="boxText">Site-specific flat labels</text>
<text x="92" y="301" class="boxText">Missing / multi-label variation</text>

<path d="M290 250 H350" class="arrow"/>

<rect x="350" y="160" width="220" height="180" class="box"/>
<text x="372" y="198" class="boxTitle">2 · Orthogonal ontology</text>
<text x="372" y="232" class="boxText">Semantic source</text>
<text x="372" y="255" class="boxText">Target · pragmatic function</text>
<text x="372" y="278" class="boxText">Social-indexical basis</text>
<text x="372" y="301" class="boxText">Mechanism · linguistic form</text>

<path d="M570 250 H630" class="arrow"/>

<rect x="630" y="140" width="240" height="220" class="gate"/>
<text x="652" y="181" class="boxTitle">3 · Reliability gate</text>
<text x="652" y="216" class="boxText">Frozen 300-row sample</text>
<text x="652" y="239" class="boxText">Independent Coder A / B</text>
<text x="652" y="262" class="boxText">Native-language review</text>
<text x="652" y="285" class="boxText">Agreement + adjudication</text>
<text x="652" y="322" class="note">No pass → no cultural fingerprint</text>

<path d="M870 250 H930" class="arrow"/>

<rect x="930" y="160" width="200" height="180" class="box"/>
<text x="952" y="198" class="boxTitle">4 · Strong comparisons</text>
<text x="952" y="232" class="boxText">Repeated lexical items</text>
<text x="952" y="255" class="boxText">Matched neutral controls</text>
<text x="952" y="278" class="boxText">Language-family structure</text>
<text x="952" y="301" class="boxText">Missingness sensitivity</text>

<path d="M1130 250 H1190" class="arrow"/>

<rect x="1190" y="160" width="160" height="180" class="box"/>
<text x="1212" y="198" class="boxTitle">5 · Atlas</text>
<text x="1212" y="232" class="boxText">Fingerprints</text>
<text x="1212" y="255" class="boxText">Uncertainty</text>
<text x="1212" y="278" class="boxText">Coverage</text>
<text x="1212" y="301" class="boxText">Provenance</text>

<text x="70" y="430" class="sub">Core inferential principle</text>
<text x="70" y="463" class="boxTitle">annotation difference ≠ cultural difference</text>
<text x="70" y="494" class="boxText">The atlas is an evidence interface produced after the measurement gates, not the starting point of the analysis.</text>
</svg>