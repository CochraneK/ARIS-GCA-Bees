<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Held-out circular-Robinson-style sensitivity</title>
<desc id="desc">At 40 features, circular mean violation 0.222, tree 0.209, random 0.237. At 60 features, circular 0.297, tree 0.284, random 0.307. Lower is better.</desc>
<rect width="1000" height="600" fill="white"/>
<text x="500" y="45" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700">Held-out circular-Robinson-style sensitivity</text>
<text x="500" y="76" text-anchor="middle" font-family="sans-serif" font-size="15">Mean row-unimodality violation; lower is better</text>
<line x1="120" y1="500" x2="930" y2="500" stroke="#222" stroke-width="2"/>
<line x1="120" y1="120" x2="120" y2="500" stroke="#222" stroke-width="2"/>
<g font-family="sans-serif" font-size="14" text-anchor="end">
<text x="108" y="505">0.00</text><text x="108" y="410">0.08</text><text x="108" y="315">0.16</text><text x="108" y="220">0.24</text><text x="108" y="125">0.32</text>
</g>
<g stroke="#ddd"><line x1="120" y1="405" x2="930" y2="405"/><line x1="120" y1="310" x2="930" y2="310"/><line x1="120" y1="215" x2="930" y2="215"/><line x1="120" y1="120" x2="930" y2="120"/></g>
<rect x="230" y="236" width="80" height="264" fill="#6b7280"/><rect x="315" y="252" width="80" height="248" fill="#9ca3af"/><rect x="400" y="219" width="80" height="281" fill="#d1d5db"/>
<rect x="610" y="147" width="80" height="353" fill="#6b7280"/><rect x="695" y="163" width="80" height="337" fill="#9ca3af"/><rect x="780" y="135" width="80" height="365" fill="#d1d5db"/>
<g font-family="sans-serif" font-size="14" text-anchor="middle">
<text x="355" y="535">40 features</text><text x="735" y="535">60 features</text>
<text x="270" y="226">0.222</text><text x="355" y="242">0.209</text><text x="440" y="209">0.237</text>
<text x="650" y="137">0.297</text><text x="735" y="153">0.284</text><text x="820" y="125">0.307</text>
</g>
<rect x="280" y="565" width="18" height="18" fill="#6b7280"/><text x="305" y="579" font-family="sans-serif" font-size="13">Circular order</text>
<rect x="430" y="565" width="18" height="18" fill="#9ca3af"/><text x="455" y="579" font-family="sans-serif" font-size="13">Tree leaf order</text>
<rect x="590" y="565" width="18" height="18" fill="#d1d5db"/><text x="615" y="579" font-family="sans-serif" font-size="13">Random order</text>
</svg>