<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Figure 6 · Stable order is not periodic closure</title><desc id="desc">Conceptual distinction between reproducible open ordering and a genuinely supported wrap-around closure edge.</desc>
<rect width="1200" height="760" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17201f}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#66706c}.label{font-size:18px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#66706c}.box2{fill:#eef4f2;stroke:#5f827b;stroke-width:1.5}.box3{fill:#f3f0f7;stroke:#80729a;stroke-width:1.5}.arrow{stroke:#5f6763;stroke-width:2.5;fill:none;marker-end:url(#arr)}.pt{fill:#4b5563}.pt2{fill:#7c6f8f}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6763"/></marker></defs>
<text x="60" y="58" class="title">Figure 6 · Stable order is not the same as periodic closure</text><text x="60" y="88" class="sub">A reproducible sequence can exist even when the final-to-first wrap-around relation is weak.</text>
<rect x="70" y="145" width="500" height="470" rx="18" class="box2"/><text x="320" y="187" text-anchor="middle" class="label">Stable open ordering</text><text x="320" y="218" text-anchor="middle" class="small">Example: Grammar linear order circle stability = 0.811</text><line x1="135" y1="365" x2="505" y2="365" class="arrow"/>
<circle cx="145" cy="365" r="24" class="pt"/><text x="145" y="371" text-anchor="middle" style="fill:white;font-family:Arial;font-size:14px">1</text><circle cx="225" cy="365" r="24" class="pt"/><text x="225" y="371" text-anchor="middle" style="fill:white;font-family:Arial;font-size:14px">2</text><circle cx="305" cy="365" r="24" class="pt"/><text x="305" y="371" text-anchor="middle" style="fill:white;font-family:Arial;font-size:14px">3</text><circle cx="385" cy="365" r="24" class="pt"/><text x="385" y="371" text-anchor="middle" style="fill:white;font-family:Arial;font-size:14px">4</text><circle cx="465" cy="365" r="24" class="pt"/><text x="465" y="371" text-anchor="middle" style="fill:white;font-family:Arial;font-size:14px">5</text><text x="320" y="445" text-anchor="middle" class="body">Neighbor relations can be stable and predictive</text><text x="320" y="475" text-anchor="middle" class="body">without implying that the sequence should wrap around.</text>
<rect x="630" y="145" width="500" height="470" rx="18" class="box3"/><text x="880" y="187" text-anchor="middle" class="label">Periodic closure requires the extra edge</text><text x="880" y="218" text-anchor="middle" class="small">Global 60-feature closure ratio = 0.037 ± 0.091</text><circle cx="880" cy="385" r="135" fill="none" stroke="#9aa09c" stroke-width="2"/>
<circle cx="880.0" cy="250.0" r="24" class="pt2"/><text x="880.0" y="256.0" text-anchor="middle" style="fill:white;font-family:Arial;font-size:14px">1</text><circle cx="1008.4" cy="343.3" r="24" class="pt2"/><text x="1008.4" y="349.3" text-anchor="middle" style="fill:white;font-family:Arial;font-size:14px">2</text><circle cx="959.4" cy="494.2" r="24" class="pt2"/><text x="959.4" y="500.2" text-anchor="middle" style="fill:white;font-family:Arial;font-size:14px">3</text><circle cx="800.6" cy="494.2" r="24" class="pt2"/><text x="800.6" y="500.2" text-anchor="middle" style="fill:white;font-family:Arial;font-size:14px">4</text><circle cx="751.6" cy="343.3" r="24" class="pt2"/><text x="751.6" y="349.3" text-anchor="middle" style="fill:white;font-family:Arial;font-size:14px">5</text><line x1="880.0" y1="250.0" x2="1008.4" y2="343.3" stroke="#6f667d" stroke-width="4"/><line x1="1008.4" y1="343.3" x2="959.4" y2="494.2" stroke="#6f667d" stroke-width="4"/><line x1="959.4" y1="494.2" x2="800.6" y2="494.2" stroke="#6f667d" stroke-width="4"/><line x1="800.6" y1="494.2" x2="751.6" y2="343.3" stroke="#6f667d" stroke-width="4"/><line x1="751.6" y1="343.3" x2="880.0" y2="250.0" stroke="#a46c18" stroke-width="4" stroke-dasharray="10 8"/><text x="880" y="570" text-anchor="middle" class="body">The dashed wrap-around edge is the additional claim.</text><text x="600" y="690" text-anchor="middle" class="label">Ordering evidence ≠ closure evidence</text></svg>