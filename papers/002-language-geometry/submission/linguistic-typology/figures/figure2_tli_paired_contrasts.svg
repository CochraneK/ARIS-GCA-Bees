<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">TLI repeated family-held-out paired contrasts</title>
<desc id="desc">Tree minus circle mean 0.073 with 95 percent bootstrap interval 0.055 to 0.092; low-rank minus circle 0.046 with interval 0.033 to 0.061; Euclidean minus circle 0.001 with interval minus 0.020 to 0.021.</desc>
<rect width="1000" height="540" fill="white"/>
<text x="500" y="45" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700">TLI repeated family-held-out contrasts</text>
<text x="500" y="76" text-anchor="middle" font-family="sans-serif" font-size="15">Paired Spearman differences vs optimized circle; 95% split-bootstrap intervals</text>
<line x1="180" y1="440" x2="920" y2="440" stroke="#222" stroke-width="2"/>
<line x1="382" y1="120" x2="382" y2="440" stroke="#777" stroke-width="2" stroke-dasharray="6 6"/>
<g font-family="sans-serif" font-size="14" text-anchor="middle">
<text x="247" y="468">−0.02</text><text x="382" y="468">0.00</text><text x="517" y="468">0.02</text><text x="652" y="468">0.04</text><text x="787" y="468">0.06</text><text x="922" y="468">0.08+</text>
</g>
<g font-family="sans-serif" font-size="17" text-anchor="end">
<text x="165" y="166">Tree − circle</text><text x="165" y="276">Low-rank − circle</text><text x="165" y="386">Euclidean − circle</text>
</g>
<line x1="753" y1="160" x2="1000" y2="160" stroke="#4b5563" stroke-width="5"/><circle cx="875" cy="160" r="9" fill="#111827"/>
<line x1="605" y1="270" x2="794" y2="270" stroke="#4b5563" stroke-width="5"/><circle cx="693" cy="270" r="9" fill="#111827"/>
<line x1="247" y1="380" x2="524" y2="380" stroke="#4b5563" stroke-width="5"/><circle cx="389" cy="380" r="9" fill="#111827"/>
<g font-family="sans-serif" font-size="14">
<text x="820" y="140">+0.073 [0.055, 0.092]</text><text x="635" y="250">+0.046 [0.033, 0.061]</text><text x="300" y="360">+0.001 [−0.020, 0.021]</text>
</g>
<text x="500" y="515" text-anchor="middle" font-family="sans-serif" font-size="14">Intervals resample split-level contrasts and do not represent phylogenetic uncertainty.</text>
</svg>