<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:28px;font-weight:700;fill:#f8fafc}.sub{font-size:15px;fill:#9fb0c8}.label{font-size:14px;fill:#d8e2ef}.small{font-size:12px;fill:#9fb0c8}.metric{font-size:34px;font-weight:750;fill:#f8fafc}</style>
<text x="50" y="55" class="title">A research system, not a pile of papers</text>
<text x="50" y="82" class="sub">Scientific work flows forward; handoff context loops back so another executor can safely continue.</text>
