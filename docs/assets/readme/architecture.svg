<rect x="510" y="128" width="220" height="156" rx="18" fill="#17365b" stroke="#77a7ff" stroke-width="1.5"/><text x="528" y="155" class="small">03</text><text x="528" y="186" class="label" style="font-size:17px;font-weight:700">Paper workspace</text><text x="528" y="212" class="small">Canonical evidence hub</text>
