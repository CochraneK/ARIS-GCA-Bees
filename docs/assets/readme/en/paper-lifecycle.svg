<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<title>Lifecycle of an ARIS4C paper</title>
<rect width="1600" height="900" rx="28" fill="#07162b"/>
<style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif}.t{font-size:48px;font-weight:800;fill:#f8fafc}.s{font-size:23px;fill:#a9bfe0}.h{font-size:25px;font-weight:750;fill:#f8fafc}.b{font-size:17px;fill:#c8d7ec}.m{font-size:14px;fill:#8da9ce}.k{font-size:16px;font-weight:700;fill:#66e7a4}.n{font-size:17px;font-weight:800;fill:#54a9ff}.metric{font-size:38px;font-weight:800;fill:#f8fafc}</style>
<text x="58" y="62" class="n">ARIS<tspan fill="#f8fafc">4C</tspan></text>
<text x="800.0" y="72" text-anchor="middle" class="t">Lifecycle of an ARIS4C paper</text>
<text x="800.0" y="112" text-anchor="middle" class="s">From idea, to evidence, to bilingual public output</text>
<rect x="35" y="190" width="205" height="470" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="66" cy="226" r="24" fill="#0f7ee8"/><text x="66" y="233" text-anchor="middle" class="h" font-size="18">1</text>
<text x="53" y="310" class="h" font-size="20">Question / idea</text>
<text x="53" y="365" class="b">define the problem</text>
<text x="53" y="397" class="b">and why it matters</text>
<path d="M243 420 L258 420" stroke="#54a9ff" stroke-width="4"/>
<path d="M254 411 L268 420 L254 429 Z" fill="#54a9ff"/>
<rect x="258" y="190" width="205" height="470" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="289" cy="226" r="24" fill="#0f7ee8"/><text x="289" y="233" text-anchor="middle" class="h" font-size="18">2</text>
<text x="276" y="310" class="h" font-size="20">Scope &amp; search</text>
<text x="276" y="365" class="b">search prior art and the gap</text>
<text x="276" y="397" class="b">test feasibility and novelty</text>
<path d="M466 420 L481 420" stroke="#54a9ff" stroke-width="4"/>
<path d="M477 411 L491 420 L477 429 Z" fill="#54a9ff"/>
<rect x="481" y="190" width="205" height="470" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="512" cy="226" r="24" fill="#0f7ee8"/><text x="512" y="233" text-anchor="middle" class="h" font-size="18">3</text>
<text x="499" y="310" class="h" font-size="20">Study design</text>
<text x="499" y="365" class="b">methods, data, metrics, controls</text>
<text x="499" y="397" class="b">and falsifiers upfront</text>
<path d="M689 420 L704 420" stroke="#54a9ff" stroke-width="4"/>
<path d="M700 411 L714 420 L700 429 Z" fill="#54a9ff"/>
<rect x="704" y="190" width="205" height="470" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="735" cy="226" r="24" fill="#0f7ee8"/><text x="735" y="233" text-anchor="middle" class="h" font-size="18">4</text>
<text x="722" y="310" class="h" font-size="20">Evidence / code / data</text>
<text x="722" y="365" class="b">run analyses and preserve</text>
<text x="722" y="397" class="b">complete provenance</text>
<path d="M912 420 L927 420" stroke="#54a9ff" stroke-width="4"/>
<path d="M923 411 L937 420 L923 429 Z" fill="#54a9ff"/>
<rect x="927" y="190" width="205" height="470" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="958" cy="226" r="24" fill="#0f7ee8"/><text x="958" y="233" text-anchor="middle" class="h" font-size="18">5</text>
<text x="945" y="310" class="h" font-size="20">Drafting</text>
<text x="945" y="365" class="b">methods, results, discussion</text>
<text x="945" y="397" class="b">visuals, references, limits</text>
<path d="M1135 420 L1150 420" stroke="#54a9ff" stroke-width="4"/>
<path d="M1146 411 L1160 420 L1146 429 Z" fill="#54a9ff"/>
<rect x="1150" y="190" width="205" height="470" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="1181" cy="226" r="24" fill="#0f7ee8"/><text x="1181" y="233" text-anchor="middle" class="h" font-size="18">6</text>
<text x="1168" y="310" class="h" font-size="20">Review gates</text>
<text x="1168" y="365" class="b">science, reproducibility</text>
<text x="1168" y="397" class="b">independent review, quality</text>
<path d="M1358 420 L1373 420" stroke="#54a9ff" stroke-width="4"/>
<path d="M1369 411 L1383 420 L1369 429 Z" fill="#54a9ff"/>
<rect x="1373" y="190" width="205" height="470" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="1404" cy="226" r="24" fill="#0f7ee8"/><text x="1404" y="233" text-anchor="middle" class="h" font-size="18">7</text>
<text x="1391" y="310" class="h" font-size="20">Public outputs</text>
<text x="1391" y="365" class="b">EN + ZH PDFs</text>
<text x="1391" y="397" class="b">code, data, visuals, handoff</text>
<rect x="35" y="720" width="1530" height="88" rx="22" fill="#0b213c" stroke="#245d95"/>
<text x="70" y="775" class="k" font-size="19">Cross-cutting: traceable evidence · adaptive visuals · EN + ZH at completion · continuity kept current</text>
</svg>
