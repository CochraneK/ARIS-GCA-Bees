<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<title>Common structure of an ARIS4C paper project</title>
<rect width="1600" height="900" rx="28" fill="#07162b"/>
<style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif}.t{font-size:48px;font-weight:800;fill:#f8fafc}.s{font-size:23px;fill:#a9bfe0}.h{font-size:25px;font-weight:750;fill:#f8fafc}.b{font-size:17px;fill:#c8d7ec}.m{font-size:14px;fill:#8da9ce}.k{font-size:16px;font-weight:700;fill:#66e7a4}.n{font-size:17px;font-weight:800;fill:#54a9ff}.metric{font-size:38px;font-weight:800;fill:#f8fafc}</style>
<text x="58" y="62" class="n">ARIS<tspan fill="#f8fafc">4C</tspan></text>
<text x="800.0" y="72" text-anchor="middle" class="t">Common structure of an ARIS4C paper project</text>
<text x="800.0" y="112" text-anchor="middle" class="s">A reproducible, auditable, resumable workspace for every numbered paper</text>
<rect x="80" y="155" width="1440" height="590" rx="28" fill="#091f39" stroke="#245d95" stroke-width="2"/>
<text x="120" y="210" class="h" font-size="32">papers/<tspan fill="#54a9ff">00X-project/</tspan></text>
<rect x="120" y="270" width="390" height="185" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="162" cy="312" r="24" fill="#0f7ee8"/><text x="162" y="319" text-anchor="middle" class="h" font-size="18">1</text>
<text x="202" y="318" class="h">paper.json</text>
<text x="202" y="350" class="s" font-size="18">metadata · links · status</text>
<text x="148" y="388" class="b">title, authors, status, public entry</text>
<text x="148" y="415" class="b">and ARIS provenance</text>
<rect x="575" y="270" width="390" height="185" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="617" cy="312" r="24" fill="#0f7ee8"/><text x="617" y="319" text-anchor="middle" class="h" font-size="18">2</text>
<text x="657" y="318" class="h">manuscript/</text>
<text x="657" y="350" class="s" font-size="18">English + Chinese papers</text>
<text x="603" y="388" class="b">source manuscripts</text>
<text x="603" y="415" class="b">and compiled/public versions</text>
<rect x="1030" y="270" width="390" height="185" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="1072" cy="312" r="24" fill="#0f7ee8"/><text x="1072" y="319" text-anchor="middle" class="h" font-size="18">3</text>
<text x="1112" y="318" class="h">figures/ + tables/</text>
<text x="1112" y="350" class="s" font-size="18">visual narrative</text>
<text x="1058" y="388" class="b">visuals follow information gain</text>
<text x="1058" y="415" class="b">no fixed figure quota</text>
<rect x="120" y="500" width="390" height="185" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="162" cy="542" r="24" fill="#0f7ee8"/><text x="162" y="549" text-anchor="middle" class="h" font-size="18">4</text>
<text x="202" y="548" class="h">code/ + data/</text>
<text x="202" y="580" class="s" font-size="18">analysis · provenance</text>
<text x="148" y="618" class="b">code, processed data, source links</text>
<text x="148" y="645" class="b">and reproducibility assets</text>
<rect x="575" y="500" width="390" height="185" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="617" cy="542" r="24" fill="#0f7ee8"/><text x="617" y="549" text-anchor="middle" class="h" font-size="18">5</text>
<text x="657" y="548" class="h">process/</text>
<text x="657" y="580" class="s" font-size="18">design · gates · frozen decisions</text>
<text x="603" y="618" class="b">study plan, review gates</text>
<text x="603" y="645" class="b">preregistration and state</text>
<rect x="1030" y="500" width="390" height="185" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="1072" cy="542" r="24" fill="#0f7ee8"/><text x="1072" y="549" text-anchor="middle" class="h" font-size="18">6</text>
<text x="1112" y="548" class="h">handoff/</text>
<text x="1112" y="580" class="s" font-size="18">cross-agent continuity</text>
<text x="1058" y="618" class="b">STATUS · TODO · DECISIONS</text>
<text x="1058" y="645" class="b">CHATLOG · AGENT_HANDOFF · SESSION_LOG</text>
<rect x="80" y="785" width="1440" height="62" rx="18" fill="#0b213c" stroke="#245d95"/>
<text x="120" y="825" class="k">traceable evidence · bilingual at completion · adaptive visuals · resumable across devices/accounts/agents</text>
</svg>
