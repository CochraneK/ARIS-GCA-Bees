<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img">
<title>Delivery &amp; continuity</title>
<rect width="1600" height="480" rx="28" fill="#07162b"/>
<style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif}.t{font-size:48px;font-weight:800;fill:#f8fafc}.s{font-size:23px;fill:#a9bfe0}.h{font-size:25px;font-weight:750;fill:#f8fafc}.b{font-size:17px;fill:#c8d7ec}.m{font-size:14px;fill:#8da9ce}.k{font-size:16px;font-weight:700;fill:#66e7a4}.n{font-size:17px;font-weight:800;fill:#54a9ff}.metric{font-size:38px;font-weight:800;fill:#f8fafc}</style>
<text x="58" y="62" class="n">ARIS<tspan fill="#f8fafc">4C</tspan></text>
<text x="800.0" y="72" text-anchor="middle" class="t">Delivery &amp; continuity</text>
<text x="800.0" y="112" text-anchor="middle" class="s">The repository preserves both research outputs and enough context for the next executor to continue</text>
<rect x="70" y="180" width="330" height="180" rx="24" fill="#0d2442" stroke="#245d95"/>
<text x="94" y="235" class="metric">17</text>
<text x="94" y="278" class="h">Tracked projects</text>
<text x="94" y="318" class="m">canonical paper.json</text>
<rect x="450" y="180" width="330" height="180" rx="24" fill="#0d2442" stroke="#245d95"/>
<text x="474" y="235" class="metric">17</text>
<text x="474" y="278" class="h">Continuity-ready</text>
<text x="474" y="318" class="m">17/17 handoffs</text>
<rect x="830" y="180" width="330" height="180" rx="24" fill="#0d2442" stroke="#245d95"/>
<text x="854" y="235" class="metric">2</text>
<text x="854" y="278" class="h">Bilingual PDF-ready</text>
<text x="854" y="318" class="m">2/17 EN + ZH</text>
<rect x="1210" y="180" width="330" height="180" rx="24" fill="#0d2442" stroke="#245d95"/>
