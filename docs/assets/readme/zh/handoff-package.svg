<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<title>跨 Agent 接管包</title>
<rect width="1600" height="900" rx="28" fill="#07162b"/>
<style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif}.t{font-size:48px;font-weight:800;fill:#f8fafc}.s{font-size:23px;fill:#a9bfe0}.h{font-size:25px;font-weight:750;fill:#f8fafc}.b{font-size:17px;fill:#c8d7ec}.m{font-size:14px;fill:#8da9ce}.k{font-size:16px;font-weight:700;fill:#66e7a4}.n{font-size:17px;font-weight:800;fill:#54a9ff}.metric{font-size:38px;font-weight:800;fill:#f8fafc}</style>
<text x="58" y="62" class="n">ARIS<tspan fill="#f8fafc">4C</tspan></text>
<text x="800.0" y="72" text-anchor="middle" class="t">跨 Agent 接管包</text>
<text x="800.0" y="112" text-anchor="middle" class="s">让同一篇 Paper 在不同对话、账号、电脑和 Agent 之间持续推进</text>
<rect x="80" y="190" width="315" height="170" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="118" cy="230" r="22" fill="#0f7ee8"/><text x="118" y="237" text-anchor="middle" class="h" font-size="16">1</text>
<text x="156" y="237" class="h" font-size="22">README.md</text>
<text x="104" y="292" class="b">快速上手与读取顺序</text>
<rect x="455" y="190" width="315" height="170" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="493" cy="230" r="22" fill="#0f7ee8"/><text x="493" y="237" text-anchor="middle" class="h" font-size="16">2</text>
<text x="531" y="237" class="h" font-size="22">STATUS.md</text>
<text x="479" y="292" class="b">当前状态、进度、gate、blocker</text>
<rect x="830" y="190" width="315" height="170" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="868" cy="230" r="22" fill="#0f7ee8"/><text x="868" y="237" text-anchor="middle" class="h" font-size="16">3</text>
<text x="906" y="237" class="h" font-size="22">TODO.md</text>
<text x="854" y="292" class="b">开放任务、优先级与下一步</text>
<rect x="1205" y="190" width="315" height="170" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="1243" cy="230" r="22" fill="#0f7ee8"/><text x="1243" y="237" text-anchor="middle" class="h" font-size="16">4</text>
<text x="1281" y="237" class="h" font-size="22">DECISIONS.md</text>
<text x="1229" y="292" class="b">关键决策、理由与替代方案</text>
<rect x="80" y="410" width="315" height="170" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="118" cy="450" r="22" fill="#0f7ee8"/><text x="118" y="457" text-anchor="middle" class="h" font-size="16">5</text>
<text x="156" y="457" class="h" font-size="22">CONTEXT.md</text>
<text x="104" y="512" class="b">研究背景、scope 与关键上下文</text>
<rect x="455" y="410" width="315" height="170" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="493" cy="450" r="22" fill="#0f7ee8"/><text x="493" y="457" text-anchor="middle" class="h" font-size="16">6</text>
<text x="531" y="457" class="h" font-size="22">CHATLOG.md</text>
<text x="479" y="512" class="b">重要对话的 public-safe 摘要</text>
<rect x="830" y="410" width="315" height="170" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="868" cy="450" r="22" fill="#0f7ee8"/><text x="868" y="457" text-anchor="middle" class="h" font-size="16">7</text>
<text x="906" y="457" class="h" font-size="22">AGENT_HANDOFF.md</text>
<text x="854" y="512" class="b">下一位 Agent 的明确接管说明</text>
<rect x="1205" y="410" width="315" height="170" rx="22" fill="#0d2442" stroke="#245d95"/>
<circle cx="1243" cy="450" r="22" fill="#0f7ee8"/><text x="1243" y="457" text-anchor="middle" class="h" font-size="16">8</text>
<text x="1281" y="457" class="h" font-size="22">SESSION_LOG.md</text>
<text x="1229" y="512" class="b">每次执行、验证与 commit 记录</text>
<rect x="80" y="675" width="1440" height="76" rx="20" fill="#0b213c" stroke="#245d95"/>
<text x="120" y="722" class="h">当前执行者 → 更新 handoff/ → Git 仓库 → 下一位执行者读取 handoff/ → 继续推进</text>
<text x="800" y="825" text-anchor="middle" class="k">continuity 是 final output contract 的组成部分，不是可选附加项</text>
</svg>
