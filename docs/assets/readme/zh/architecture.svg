<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img">
<title>ARIS4C 研究系统架构</title>
<rect width="1600" height="780" rx="28" fill="#07162b"/>
<style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif}.t{font-size:48px;font-weight:800;fill:#f8fafc}.s{font-size:23px;fill:#a9bfe0}.h{font-size:25px;font-weight:750;fill:#f8fafc}.b{font-size:17px;fill:#c8d7ec}.m{font-size:14px;fill:#8da9ce}.k{font-size:16px;font-weight:700;fill:#66e7a4}.n{font-size:17px;font-weight:800;fill:#54a9ff}.metric{font-size:38px;font-weight:800;fill:#f8fafc}</style>
<text x="58" y="62" class="n">ARIS<tspan fill="#f8fafc">4C</tspan></text>
<text x="800.0" y="72" text-anchor="middle" class="t">ARIS4C 研究系统架构</text>
<text x="800.0" y="112" text-anchor="middle" class="s">科学工作向前流动；handoff 上下文形成回路，让下一位执行者安全继续</text>
<rect x="60" y="180" width="240" height="150" rx="22" fill="#102c50" stroke="#245d95" stroke-width="2"/>
<text x="80" y="218" class="n">01</text>
<text x="80" y="262" class="h">研究问题</text>
<text x="80" y="298" class="m">想法 · 假设 · scope</text>
<line x1="310" y1="255" x2="342" y2="255" stroke="#54a9ff" stroke-width="4"/>
<path d="M340 246 L355 255 L340 264 Z" fill="#54a9ff"/>
<rect x="360" y="180" width="240" height="150" rx="22" fill="#102c50" stroke="#245d95" stroke-width="2"/>
<text x="380" y="218" class="n">02</text>
<text x="380" y="262" class="h">ARIS 引擎</text>
<text x="380" y="298" class="m">检索 · 设计 · critique</text>
<line x1="610" y1="255" x2="642" y2="255" stroke="#54a9ff" stroke-width="4"/>
<path d="M640 246 L655 255 L640 264 Z" fill="#54a9ff"/>
<rect x="660" y="155" width="280" height="200" rx="22" fill="#102c50" stroke="#54a9ff" stroke-width="2"/>
<text x="680" y="193" class="n">03</text>
<text x="680" y="237" class="h">Paper 工作空间</text>
<text x="680" y="273" class="m">canonical evidence hub</text>
<line x1="950" y1="255" x2="982" y2="255" stroke="#54a9ff" stroke-width="4"/>
<path d="M980 246 L995 255 L980 264 Z" fill="#54a9ff"/>
<rect x="1000" y="180" width="240" height="150" rx="22" fill="#102c50" stroke="#245d95" stroke-width="2"/>
<text x="1020" y="218" class="n">04</text>
<text x="1020" y="262" class="h">Review gates</text>
<text x="1020" y="298" class="m">科学 · 复现 · 独立审查</text>
<line x1="1250" y1="255" x2="1282" y2="255" stroke="#54a9ff" stroke-width="4"/>
<path d="M1280 246 L1295 255 L1280 264 Z" fill="#54a9ff"/>
<rect x="1300" y="180" width="240" height="150" rx="22" fill="#102c50" stroke="#245d95" stroke-width="2"/>
