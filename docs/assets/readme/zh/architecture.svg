<text x="1320" y="262" class="h">公开输出</text>
<text x="1320" y="298" class="m">EN + ZH PDF</text>
<rect x="310" y="450" width="270" height="120" rx="20" fill="#0d2442" stroke="#245d95"/>
<text x="330" y="495" class="h">Evidence</text>
<text x="330" y="535" class="m">data · code · provenance</text>
<rect x="625" y="450" width="270" height="120" rx="20" fill="#0d2442" stroke="#245d95"/>
<text x="645" y="495" class="h">双语论文</text>
<text x="645" y="535" class="m">EN + ZH</text>
<rect x="940" y="450" width="270" height="120" rx="20" fill="#0d2442" stroke="#245d95"/>
<text x="960" y="495" class="h">Visual narrative</text>
<text x="960" y="535" class="m">figures · tables</text>
<rect x="1255" y="450" width="270" height="120" rx="20" fill="#0d2442" stroke="#245d95"/>
<text x="1275" y="495" class="h">handoff/</text>
<text x="1275" y="535" class="m">8-file continuity pack</text>
<rect x="80" y="650" width="1440" height="64" rx="18" fill="#0b213c" stroke="#245d95"/>
<text x="110" y="691" class="k">跨 Agent continuity</text>
<text x="360" y="691" class="b">Git → handoff/ → 下一台电脑 / 账号 / Agent → 同一个 canonical Paper 工作空间</text>
