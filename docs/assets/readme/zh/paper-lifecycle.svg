<text x="1391" y="310" class="h" font-size="20">公开输出</text>
<text x="1391" y="365" class="b">EN + ZH PDF</text>
<text x="1391" y="397" class="b">代码、数据、图表与 handoff</text>
<rect x="35" y="720" width="1530" height="88" rx="22" fill="#0b213c" stroke="#245d95"/>
<text x="70" y="775" class="k" font-size="19">贯穿全程：证据可追踪 · 图表按信息增益自适应 · 完成时 EN + ZH · continuity 持续更新</text>
</svg>
