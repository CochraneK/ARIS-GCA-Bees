<text x="276" y="310" class="h" font-size="20">界定范围与检索</text>
<text x="276" y="365" class="b">系统检索、定位 gap</text>
<text x="276" y="397" class="b">确认可行性与新颖性</text>
<path d="M466 420 L481 420" stroke="#54a9ff" stroke-width="4"/>
<path d="M477 411 L491 420 L477 429 Z" fill="#54a9ff"/>
